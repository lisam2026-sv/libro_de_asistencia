  --stage:#0A0F1F; --stage-ink:#E6EBF8; --stage-line:#26304F;
  --sh-1:0 1px 2px rgba(17,24,48,.05),0 1px 3px rgba(17,24,48,.05);
  --sh-2:0 12px 32px -10px rgba(17,24,48,.18),0 2px 6px rgba(17,24,48,.05);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F18; --surface:#131925; --surface-2:#171E2C; --sunk:#0F141F; --ink:#E7EBF5; --ink-2:#C2C9DB; --muted:#8B95AE; --line:#222B3C; --line-2:#2F3A50;
  --accent:#8CA6F2; --accent-2:#A4B9F6; --accent-ink:#0D1530; --accent-soft:#1C2647; --margin:#E2716A;
  --p:#5DC08B; --p-soft:#15301F; --a:#EE8077; --a-soft:#3A1B1A; --t:#E4B05A; --t-soft:#36290F; --j:#AE9DF0; --j-soft:#262042;
  --side-bg:#080C18; --side-hover:#121A33; --side-active:#1B2650; --side-line:#161E38;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 14px 36px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F18; --surface:#131925; --surface-2:#171E2C; --sunk:#0F141F; --ink:#E7EBF5; --ink-2:#C2C9DB; --muted:#8B95AE; --line:#222B3C; --line-2:#2F3A50;
  --accent:#8CA6F2; --accent-2:#A4B9F6; --accent-ink:#0D1530; --accent-soft:#1C2647; --margin:#E2716A;
  --p:#5DC08B; --p-soft:#15301F; --a:#EE8077; --a-soft:#3A1B1A; --t:#E4B05A; --t-soft:#36290F; --j:#AE9DF0; --j-soft:#262042;
  --side-bg:#080C18; --side-hover:#121A33; --side-active:#1B2650; --side-line:#161E38;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 14px 36px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.015em}
h1{font-size:clamp(1.55rem,1.2rem + 1.2vw,2rem);font-weight:700}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
svg{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}

/* ---------- Armazón ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;
  padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.1;color:#fff}
.brand-s{font-size:.76rem;color:var(--side-muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:16px;flex:1}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);font-weight:600;padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:.93rem;transition:background .15s}
.nav a svg{opacity:.75}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav a[aria-current="page"] svg{opacity:1;color:#9FB4F5}
.nav a .badge{margin-left:auto}
.badge{font-family:var(--f-mono);font-size:.7rem;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:#E25B52;color:#fff;line-height:1.5}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--side-line)}
.me-n{font-weight:600;font-size:.88rem;line-height:1.2;color:#fff}
.me-r{font-size:.76rem;color:var(--side-muted)}
.me .icon-btn{margin-left:auto;color:var(--side-muted)}
.me .icon-btn:hover{background:var(--side-hover);color:#fff}
.main{min-width:0;display:flex;flex-direction:column;gap:22px;padding-block:18px 56px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));max-width:1440px;width:100%}
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.top-date{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem;font-weight:500}
.top-sp{flex:1}
.top .menu-btn{display:none}
.scrim{display:none}
.head{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.head-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.head-t p{color:var(--muted);max-width:68ch}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(288px,86vw);transform:translateX(-102%);transition:transform .22s ease;padding-top:max(22px,env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none;box-shadow:var(--sh-2)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:39}
  .top .menu-btn{display:inline-grid}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:18px}
}

/* ---------- Componentes ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--sh-1)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h .head-t{gap:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start;box-shadow:var(--sh-1)}
.metric-l{font-size:.8rem;color:var(--muted);font-weight:600}
.metric-v{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:-.02em;grid-column:1}
.metric-v small{font-size:1rem;color:var(--muted);font-weight:600}
.metric-s{font-size:.8rem;color:var(--muted);grid-column:1/-1}
.metric-i{grid-row:1/3;grid-column:2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.metric-i.p{background:var(--p-soft);color:var(--p)}.metric-i.a{background:var(--a-soft);color:var(--a)}.metric-i.t{background:var(--t-soft);color:var(--t)}
.ring{grid-row:1/3;grid-column:2;--v:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--rc,var(--p)) calc(var(--v)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring::after{content:"";width:38px;height:38px;border-radius:50%;background:var(--surface)}
.btn{font:inherit;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s;box-shadow:var(--sh-1)}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{background:var(--a);border-color:var(--a);color:#fff}
.btn-danger:hover{background:var(--a);filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--sunk);border-color:transparent}
.btn-sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn-lg{padding:11px 18px;font-size:.95rem}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.hint{font-size:.76rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;min-width:0;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent);box-shadow:none}
textarea{min-height:120px;font-family:var(--f-mono);font-size:.84rem}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{padding-left:36px;width:100%}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;line-height:1.35}
.check input{margin-top:1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.form .full{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted);line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.chip-ok{background:var(--p-soft);color:var(--p)}.chip-warn{background:var(--t-soft);color:var(--t)}.chip-crit{background:var(--a-soft);color:var(--a)}.chip-j{background:var(--j-soft);color:var(--j)}.chip-acc{background:var(--accent-soft);color:var(--accent)}
.via{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--muted);font-family:var(--f-mono)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--t-soft);color:var(--ink);font-size:.88rem;line-height:1.45}
.note svg{color:var(--t);margin-top:1px}
.note-info{background:var(--accent-soft)}.note-info svg{color:var(--accent)}
.demo{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:11px 14px 11px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:.88rem;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty svg{color:var(--line-2)}
.empty b{color:var(--ink)}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:.74rem;font-weight:700;background:var(--accent-soft);color:var(--accent);object-fit:cover;letter-spacing:.02em}
.av-lg{width:64px;height:64px;font-size:1.2rem}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1)}
.panel .tbl-wrap{box-shadow:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.linkbtn{font:inherit;color:var(--ink);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.pctbar{display:flex;align-items:center;gap:9px;min-width:130px}
.pctbar-t{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pctbar-f{height:100%;border-radius:99px;background:var(--p)}
.pctbar-f.warn{background:var(--t)}.pctbar-f.crit{background:var(--a)}

/* Segmentados y pestañas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pill-tabs{display:inline-flex;padding:4px;border-radius:12px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.pill-tabs button{font:inherit;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer}
.pill-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

/* Pase de lista */
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{display:flex;align-items:baseline;gap:7px;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.84rem}
.count b{font-family:var(--f-mono);font-size:1.05rem}
.k-P{background:var(--p-soft);color:var(--p)}.k-A{background:var(--a-soft);color:var(--a)}.k-T{background:var(--t-soft);color:var(--t)}.k-J{background:var(--j-soft);color:var(--j)}
.roll{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--sh-1)}
.roll-r{display:grid;grid-template-columns:30px minmax(0,1fr) auto minmax(0,270px);gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.roll-r:last-child{border-bottom:0}
.roll-r.is-A{background:color-mix(in srgb,var(--a-soft) 50%,transparent);border-left-color:var(--a)}
.roll-r.is-T{background:color-mix(in srgb,var(--t-soft) 50%,transparent);border-left-color:var(--t)}
.roll-r.is-J{background:color-mix(in srgb,var(--j-soft) 50%,transparent);border-left-color:var(--j)}
.roll-n{font-family:var(--f-mono);color:var(--muted);font-size:.82rem;text-align:right}
.roll-name{font-weight:600;line-height:1.25}
.roll-sub{font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-family:var(--f-mono);font-weight:600;width:42px;height:36px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:background .12s}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.seg button:disabled{cursor:not-allowed}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--p);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--a);color:#fff}
.seg button[aria-pressed="true"][data-v="T"]{background:var(--t);color:#fff}
.seg button[aria-pressed="true"][data-v="J"]{background:var(--j);color:#fff}
.roll-x{display:flex;gap:6px;min-width:0}
.roll-x input{flex:1;padding:6px 9px;font-size:.84rem}
.roll-x input[type="time"]{flex:0 0 110px}
.savebar{position:sticky;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2);z-index:5}
@media (max-width:760px){.roll-r{grid-template-columns:26px minmax(0,1fr);row-gap:8px;padding:10px 12px}.roll-r .seg,.roll-r .roll-x{grid-column:2}}

/* Registro mensual */
.reg{font-size:.8rem}
.reg th,.reg td{padding:5px 6px;border-right:1px solid var(--line)}
.reg th.d,.reg td.d{text-align:center;width:30px;min-width:30px;font-family:var(--f-mono)}
.reg td.name{white-space:nowrap;border-right:2px solid var(--margin);position:sticky;left:0;background:var(--surface);z-index:1}
.reg th.name{border-right:2px solid var(--margin);position:sticky;left:0;z-index:2}
.reg tbody tr:hover td.name{background:var(--surface-2)}
.reg tfoot td.name{background:var(--surface-2)}
.reg .wd{display:block;font-size:.64rem;color:var(--muted);font-weight:500}
.c-P{color:var(--p)}.c-A{color:var(--a);background:var(--a-soft);font-weight:700}.c-T{color:var(--t);background:var(--t-soft);font-weight:700}.c-J{color:var(--j);background:var(--j-soft);font-weight:700}
.c-0{color:var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}

/* Gráfico */
.bars{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
.bars-y{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-align:right;height:160px;margin-top:-6px;padding-bottom:0}
.bars-plot{position:relative;height:160px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line-2);
  background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar-f{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--surface)))}
.bar-f.warn{background:var(--t)}
.bar-v{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.bars-x{grid-column:2;display:flex;gap:8px}
.bars-x span{flex:1;text-align:center;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);min-width:0}

.list{display:flex;flex-direction:column}
.list-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-r:last-child{border-bottom:0}
.list-r>div{min-width:0}

/* ---------- Control de entrada ---------- */
.kiosk{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:20px;align-items:start}
.stage-wrap{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:var(--stage);aspect-ratio:4/3;max-width:100%;color:var(--stage-ink);box-shadow:var(--sh-2)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.stage-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#18224A 0%,var(--stage) 60%)}
.stage-idle p{color:#AEB8D6;max-width:40ch;font-size:.92rem}
.stage-idle svg{color:#7F95DA}
.frame{position:absolute;inset:16% 22%;pointer-events:none}
.stage.face .frame{inset:12% 28%;border-radius:44% 44% 40% 40%;border:2px dashed rgba(255,255,255,.35)}
.frame i{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.9}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.stage.face .frame i{display:none}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#8FB0FF,transparent);box-shadow:0 0 12px #8FB0FF;top:50%}
@media (prefers-reduced-motion:no-preference){.scanline{animation:scan 2.2s ease-in-out infinite}@keyframes scan{0%,100%{top:4%}50%{top:96%}}}
.stage-status{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.8rem;pointer-events:none}
.stage-status span{background:rgba(6,10,22,.72);backdrop-filter:blur(6px);padding:5px 11px;border-radius:99px;color:#DCE3F6}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.wedge{display:flex;gap:8px;align-items:center}
.wedge .search{flex:1}
.k-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.clock{display:flex;flex-direction:column;gap:2px}
.clock-t{font-family:var(--f-display);font-size:clamp(2.6rem,2rem + 2vw,3.6rem);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.result{border-radius:var(--r-lg);padding:18px;display:flex;gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);min-height:112px;box-shadow:var(--sh-1);transition:background .2s,border-color .2s}
.result .av{width:72px;height:72px;font-size:1.3rem}
.result-n{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.15}
.result.r-P{background:var(--p-soft);border-color:color-mix(in srgb,var(--p) 40%,transparent)}
.result.r-T{background:var(--t-soft);border-color:color-mix(in srgb,var(--t) 40%,transparent)}
.result.r-err{background:var(--a-soft);border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.result.r-ya{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.result-s{font-weight:700;font-size:.95rem}
.r-P .result-s{color:var(--p)}.r-T .result-s{color:var(--t)}.r-err .result-s{color:var(--a)}.r-ya .result-s{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.result.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.kiosk-full{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
@media (max-width:900px){.kiosk{grid-template-columns:minmax(0,1fr)}}

/* Carnets */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.carnet{aspect-ratio:85.6/54;max-width:100%;border-radius:14px;overflow:hidden;background:#fff;color:#111830;border:1px solid #D9DEEA;display:grid;grid-template-rows:auto 1fr auto;box-shadow:var(--sh-1);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
.carnet-h{background:#0E1530;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;font-weight:600;letter-spacing:.02em}
.carnet-h b{font-family:var(--f-display);font-size:.82rem;letter-spacing:0}
.carnet-b{display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:10px;padding:10px 12px;align-items:center;min-height:0}
.carnet-b .av{width:46px;height:46px;font-size:.9rem;background:#E4E9FA;color:#2A4DB5}
.carnet-n{font-family:var(--f-display);font-weight:700;font-size:.92rem;line-height:1.12;margin-top:6px}
.carnet-g{font-size:.72rem;color:#4A5370;margin-top:2px}
.carnet-nie{font-family:var(--f-mono);font-size:.68rem;color:#4A5370;margin-top:4px}
.carnet-qr svg{width:100%;height:auto;display:block}
.carnet-f{font-size:.6rem;color:#677190;padding:4px 12px 6px;border-top:1px dashed #D9DEEA;display:flex;justify-content:space-between}

/* Diálogos */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--sh-2)}
dialog::backdrop{background:rgba(8,12,26,.55);backdrop-filter:blur(2px)}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:dlg .18s ease-out}@keyframes dlg{from{transform:translateY(8px) scale(.99);opacity:0}}}
.dlg{padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#dlg2{width:min(460px,calc(100vw - 32px))}

/* ---------- Acceso ---------- */
.login{min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--bg)}
.login-art{position:relative;overflow:hidden;isolation:isolate;background:var(--side-bg);color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:36px;
  padding-top:max(36px,env(safe-area-inset-top,0px));padding-bottom:max(36px,env(safe-area-inset-bottom,0px));padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:48px}
.la-glow{position:absolute;inset:-25%;z-index:-3;background:radial-gradient(38% 32% at 80% 24%,rgba(70,108,224,.5),transparent 70%),radial-gradient(30% 28% at 12% 88%,rgba(200,66,58,.2),transparent 70%)}
.la-grid{position:absolute;right:-60px;top:52%;transform:translateY(-50%) rotate(-9deg);display:grid;grid-template-columns:repeat(12,30px);gap:8px;z-index:-2;
  -webkit-mask-image:radial-gradient(closest-side,#000 45%,transparent);mask-image:radial-gradient(closest-side,#000 45%,transparent)}
.la-grid i{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
.la-grid i.on{background:var(--c)}
.la-margin{position:absolute;top:96px;bottom:0;left:calc(max(48px,env(safe-area-inset-left,0px)) + 14px);width:2px;background:linear-gradient(#E8655C,rgba(232,101,92,.15));transform-origin:top;z-index:-1}
.la-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.la-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);font-family:var(--f-mono);font-size:.82rem;color:#D7DEF4;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.la-pill i{width:7px;height:7px;border-radius:50%;background:#5DC08B;box-shadow:0 0 0 0 rgba(93,192,139,.6)}
.la-mid{display:flex;flex-direction:column;gap:26px;padding-left:44px}
.la-kicker{font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#93A3D6;font-weight:600}
.login-big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,1.4rem + 3.4vw,4.6rem);line-height:.96;letter-spacing:-.04em;max-width:10.5ch;color:#fff}
.login-big em{font-style:normal;color:#9FB4F5}
.login-big .w{display:inline-block}
.la-scan{display:flex;align-items:center;gap:16px;width:min(380px,100%);padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.la-qr{position:relative;width:58px;height:58px;border-radius:12px;display:grid;place-items:center;background:#fff;color:#0E1530;overflow:hidden;flex-shrink:0}
.la-line{position:absolute;left:4px;right:4px;height:2px;top:50%;background:#2A4DB5;box-shadow:0 0 10px #2A4DB5}
.la-st{display:flex;align-items:center;gap:8px;font-size:.95rem;transition:opacity .25s,transform .25s}
.la-st.x{opacity:0;transform:translateY(4px)}
.la-dot{width:8px;height:8px;border-radius:50%;background:#8CA6F2;flex-shrink:0}
.la-st.p .la-dot{background:#5DC08B}.la-st.t .la-dot{background:#E4B05A}
.la-sub{font-size:.8rem;color:#93A3D6;margin-top:2px;transition:opacity .25s}
.la-sub.x{opacity:0}
.login-feats{list-style:none;margin:0;padding:0 0 0 44px;display:flex;flex-direction:column;gap:12px;color:#B8C2E0;font-size:.92rem;max-width:46ch}
.login-feats li{display:flex;gap:11px;align-items:center}
.login-feats svg{color:#9FB4F5}
.login-form{position:relative;display:grid;place-items:center;padding-top:max(72px,env(safe-area-inset-top,0px));padding-bottom:max(36px,env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.login-tools{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:22px}
.login-card .lt{font-size:1.9rem}
.lform{display:flex;flex-direction:column;gap:14px}
.fl{position:relative}
.fl input{width:100%;height:56px;padding:22px 46px 7px 44px;font-size:1rem;border-radius:12px;background:var(--surface)}
.fl label{position:absolute;left:45px;top:17px;font-size:.96rem;color:var(--muted);pointer-events:none;transition:top .16s ease,font-size .16s ease,color .16s ease;font-weight:500}
.fl input:focus+label,.fl input:not(:placeholder-shown)+label{top:8px;font-size:.7rem;letter-spacing:.03em;color:var(--accent);font-weight:600}
.fl .fi{position:absolute;left:14px;top:19px;color:var(--muted);pointer-events:none;display:flex}
.fl input:focus~.fi{color:var(--accent)}
.fl .eye{position:absolute;right:7px;top:8px;width:40px;height:40px}
.caps{display:flex;gap:6px;align-items:center;font-size:.8rem;font-weight:600;color:var(--t);margin-top:-6px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.btn-login{height:54px;font-size:1rem;border-radius:12px;gap:10px;position:relative;overflow:hidden;transition:background .2s,border-color .2s,transform .12s}
.btn-login:active:not(:disabled){transform:scale(.985)}
.btn-login .spin{width:18px;height:18px;border:2.2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
.btn-login.ok{background:var(--p);border-color:var(--p);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.demo-box{display:flex;flex-direction:column;gap:9px}
.demo-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.demo-chip{font:inherit;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:9px 12px;border:1px solid var(--line-2);border-radius:11px;background:var(--surface);cursor:pointer;text-align:left;transition:border-color .15s,transform .15s,box-shadow .15s;color:var(--ink)}
.demo-chip b{font-family:var(--f-mono);font-size:.82rem;color:var(--accent)}
.demo-chip span{font-size:.72rem;color:var(--muted);line-height:1.3}
.demo-chip:hover{border-color:var(--accent);box-shadow:var(--sh-1)}
.login-foot{display:flex;gap:8px;align-items:flex-start;font-size:.78rem;color:var(--muted);line-height:1.4}
.login-foot svg{margin-top:1px}
@media (prefers-reduced-motion:no-preference){
  .la-grid i{animation:cell 7s ease-in-out infinite;animation-delay:var(--d)}
  .la-grid i.on{background:rgba(255,255,255,.045)}
  @keyframes cell{0%,58%,100%{background:rgba(255,255,255,.045)}66%,86%{background:var(--c)}}
  .la-margin{animation:draw 1.3s cubic-bezier(.6,0,.2,1) both .1s}
  @keyframes draw{from{transform:scaleY(0)}}
  .la-pill i{animation:pulse 2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(93,192,139,0)}100%{box-shadow:0 0 0 0 rgba(93,192,139,0)}}
  .login-big .w{animation:rise .9s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i)*85ms + 250ms)}
  @keyframes rise{from{opacity:0;transform:translateY(22px);filter:blur(8px)}}
  .la-kicker{animation:fade .8s ease both .15s}
  .la-scan{animation:rise .9s cubic-bezier(.2,.75,.2,1) both .95s}
  .la-line{animation:qrscan 1.8s ease-in-out infinite}
  @keyframes qrscan{0%,100%{top:8%}50%{top:88%}}
  .login-feats li{animation:fade .7s ease both;animation-delay:calc(var(--i)*120ms + 1.15s)}
  @keyframes fade{from{opacity:0;transform:translateX(-6px)}}
  .login-card>*{animation:rise .75s cubic-bezier(.2,.75,.2,1) both;animation-delay:calc(var(--i,0)*80ms + 300ms)}
  .shake{animation:shake .42s ease!important}
  @keyframes shake{15%,55%{transform:translateX(-9px)}35%,75%{transform:translateX(9px)}}
  .login.leaving{animation:leave .42s ease forwards}
  @keyframes leave{to{opacity:0;transform:scale(.985);filter:blur(2px)}}
}
@media (max-width:900px){
  .login{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .login-art{gap:18px;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:28px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .la-grid{right:-110px;grid-template-columns:repeat(12,22px);gap:6px}.la-grid i{width:22px;height:22px;border-radius:6px}
  .la-margin{top:72px;left:calc(max(20px,env(safe-area-inset-left,0px)) + 8px)}
  .la-mid{padding-left:26px;gap:12px}
  .login-big{font-size:clamp(2rem,1.4rem + 3vw,2.6rem)}
  .la-scan,.login-feats{display:none}
  .login-form{place-items:start center;padding-top:28px}
  .login-tools{position:static;justify-content:flex-end;margin-bottom:8px;width:min(400px,100%)}
  .login-form{display:flex;flex-direction:column;align-items:center}
}

/* ---------- Móvil, iOS y Android ---------- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--side-bg);z-index:90;pointer-events:none}
.app{min-height:100dvh}
.side{height:100dvh;padding-top:max(22px,env(safe-area-inset-top,0px))}
.main{padding-top:max(18px,env(safe-area-inset-top,0px))}
.tabbar{display:none}
@media (pointer:coarse){
  input,select,textarea{font-size:16px}
  .seg button{width:50px;height:42px}
  .btn{min-height:42px}.btn-sm{min-height:36px}
  .icon-btn{width:44px;height:44px}
  .nav a{padding:12px 10px}
}
@media (hover:none){tbody tr:hover{background:transparent}.reg tbody tr:hover td.name{background:var(--surface)}.demo-chip:hover{box-shadow:none}}
@media (max-width:760px){
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:35;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;
    background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
    border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar a,.tabbar button{font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:58px;padding:6px 2px;font-size:.66rem;font-weight:600;color:var(--muted);text-decoration:none;background:none;border:0;cursor:pointer;position:relative}
  .tabbar [aria-current="page"]{color:var(--accent)}
  .tabbar [aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
  .tabbar .badge{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;font-size:.62rem;padding:0 5px}
  .main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
  .savebar{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  #toast{bottom:calc(80px + env(safe-area-inset-bottom,0px))}
  .top .menu-btn{display:none}
  .head .row{width:100%}.head .row .btn{flex:1}
  .metric-v{font-size:1.6rem}
  .metrics{grid-template-columns:1fr 1fr;gap:10px}
  .metric{padding:13px 14px;gap:2px 8px}
  .metric-i{width:32px;height:32px;border-radius:9px}.metric-i svg{width:17px;height:17px}
  .ring{width:36px;height:36px}.ring::after{width:26px;height:26px}
  .metric-l,.metric-s{font-size:.74rem}
  .savebar{padding:10px;gap:8px}.savebar>span{display:none}.savebar .btn{flex:1;min-height:46px}
  .d-long{display:none}.d-short{display:inline!important}
  .panel{padding:16px}
  .kiosk-full{padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}
}
.inst-slot:empty{display:none}
.d-short{display:none}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:11px;font-size:.88rem;font-weight:500;box-shadow:var(--sh-2);display:flex;gap:9px;align-items:center}
.toast.err{background:var(--a);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}

/* ---------- Escudo institucional ---------- */
.brand-logo{width:42px;height:42px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 3px 8px rgba(0,0,0,.4));transition:transform .35s cubic-bezier(.2,.8,.2,1.3)}
.brand:hover .brand-logo{transform:rotate(-7deg) scale(1.08)}
.crest{position:relative;width:var(--cs,132px);aspect-ratio:1;display:grid;place-items:center;margin-inline:auto;flex-shrink:0}
.crest-halo{position:absolute;inset:5%;border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff 0 60%,#F1F4FC 100%);box-shadow:0 0 0 1px rgba(42,77,181,.12),0 18px 40px -14px rgba(14,21,48,.45)}
.crest-ring{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.crest-ring circle{fill:none;stroke-linecap:round}
.crest-ring .draw{stroke:#C8423A;stroke-width:1.6;stroke-dasharray:100;transform:rotate(-90deg);transform-origin:center;transform-box:fill-box}
.crest-ring .dots{stroke:#2A4DB5;stroke-width:2.2;stroke-dasharray:.1 3.9;transform-origin:center;transform-box:fill-box;opacity:.65}
.crest-img{position:relative;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(14,21,48,.22))}
.crest-shine{position:absolute;inset:8%;pointer-events:none;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;
  background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.9) 50%,transparent 62%);background-size:260% 100%;background-position:160% 0}
.crest-flame{position:absolute;left:50%;top:25%;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,196,64,.75),rgba(255,140,30,.25) 45%,transparent 70%);mix-blend-mode:screen;pointer-events:none;opacity:.0}
.crest-lema{text-align:center;font-family:var(--f-display);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:.68rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .crest-img{animation:crestIn 1.1s cubic-bezier(.2,.8,.25,1.2) both .15s,crestFloat 6s ease-in-out 1.4s infinite}
  @keyframes crestIn{from{opacity:0;transform:scale(.5) rotate(-14deg);filter:blur(10px)}}
  @keyframes crestFloat{50%{transform:translateY(-4px)}}
  .crest-halo{animation:haloIn .9s ease both,haloPulse 4.2s ease-in-out 1.2s infinite}
  @keyframes haloIn{from{transform:scale(.6);opacity:0}}
  @keyframes haloPulse{50%{box-shadow:0 0 0 1px rgba(42,77,181,.18),0 0 0 10px rgba(42,77,181,.06),0 22px 50px -12px rgba(14,21,48,.5)}}
  .crest-ring .draw{animation:ringDraw 1.5s cubic-bezier(.6,0,.2,1) both .2s}
  @keyframes ringDraw{from{stroke-dashoffset:100}}
  .crest-ring .dots{animation:ringSpin 48s linear infinite}
  @keyframes ringSpin{to{transform:rotate(360deg)}}
  .crest-shine{animation:shine 5s ease-in-out 1.6s infinite}
  @keyframes shine{0%{background-position:160% 0}40%,100%{background-position:-60% 0}}
  .crest-flame{animation:flicker 1.7s ease-in-out 1.2s infinite}
  @keyframes flicker{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(1)}30%{opacity:.75;transform:translate(-50%,-52%) scale(1.15)}60%{opacity:.5;transform:translate(-50%,-49%) scale(.95)}}
  .crest.pulse .crest-img{animation:crestPulse .6s ease}
  @keyframes crestPulse{40%{transform:scale(1.08)}}
}
/* Pantalla de bienvenida */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(90% 70% at 50% 40%,#1B2A62 0%,#0E1530 55%,#080C1A 100%);color:#fff;
  padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));transition:opacity .55s ease,transform .55s ease}
#splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
#splash::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:36px 36px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent);mask-image:radial-gradient(closest-side,#000,transparent)}
.sp-in{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
.sp-in .crest-halo{box-shadow:0 0 0 1px rgba(255,255,255,.2),0 0 80px 10px rgba(110,140,240,.35)}
.sp-in .crest-ring .dots{stroke:#9FB4F5}
.sp-name{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,1.2rem + 2vw,2.4rem);letter-spacing:-.02em}
.sp-lema{font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;color:#9FB4F5;font-weight:600}
.sp-bar{width:160px;height:3px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#C8423A,#9FB4F5);transform-origin:left}
@media (prefers-reduced-motion:no-preference){
  .sp-name{animation:rise .8s cubic-bezier(.2,.75,.2,1) both .55s}
  .sp-lema{animation:rise .8s cubic-bezier(.2,.75,.2,1) both .75s}
  .sp-bar{animation:fade .5s ease both .9s}
  .sp-bar i{animation:spBar 1.1s cubic-bezier(.6,0,.2,1) both 1s}
  @keyframes spBar{from{transform:scaleX(0)}}
}
/* Panel de administrador */
.adm-role{font:inherit;font-size:.84rem;padding:5px 8px;border-radius:8px;min-width:150px}
.store{display:flex;flex-direction:column;gap:10px}
.store-r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:.86rem}
.store-r .progress{grid-column:1/-1;height:6px}
.crown{background:linear-gradient(135deg,#E9C46A,#C8923A);color:#3A2600}
.pw-show{font-family:var(--f-mono);font-size:1.3rem;font-weight:600;letter-spacing:.06em;padding:10px 14px;border-radius:10px;background:var(--sunk);text-align:center;user-select:all}
.logo-prev{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.carnet-h .row{gap:6px;flex-wrap:nowrap;min-width:0}
.carnet-logo{width:20px;height:20px;object-fit:contain;flex-shrink:0}
.ph-logo{width:46px;height:46px;object-fit:contain}
@media print{.ph-logo{width:34pt;height:34pt}}

  :root:not(#_){--bg:#fff;--surface:#fff;--surface-2:#F1F3F8;--sunk:#E9ECF3;--ink:#000;--ink-2:#222;--muted:#4D5568;--line:#C9CED8;--line-2:#9AA2B3;
    --accent:#1F3D99;--accent-soft:#E4E9FA;--margin:#C8423A;--p:#17663D;--p-soft:#DCF1E4;--a:#B0302A;--a-soft:#F7DCD9;--t:#8A5507;--t-soft:#F5E6C8;--j:#56429C;--j-soft:#E6E0F6;color-scheme:light}

  body::before{display:none}

  .ph-l{display:flex;gap:10pt;align-items:center}
  .ph-l svg{width:30pt;height:30pt}
  .ph-inst{font-family:var(--f-display);font-weight:800;font-size:13pt;line-height:1.1}
  .ph-t{font-weight:700;font-size:10.5pt;margin-top:1pt}
  .ph-s{font-size:8.5pt;color:#333}
  .ph-r{font-size:7.5pt;color:#444;text-align:right;line-height:1.45;white-space:nowrap}
  table{font-size:8.5pt;width:100%}
  th{position:static;background:#E9ECF3!important;color:#000;font-size:7pt;padding:4pt 5pt;border-bottom:1pt solid #000;letter-spacing:.04em}
  td{padding:3.5pt 5pt;border-bottom:.5pt solid #C9CED8}

  .reg td.name,.reg th.name{position:static;max-width:54mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reg td.name .linkbtn{font-weight:500}
  .reg .wd{font-size:5.5pt}
  .legend{font-size:7pt;margin-top:4pt;gap:2pt 12pt}
  .print-sign{display:grid!important;grid-auto-flow:column;grid-auto-columns:1fr;gap:14mm;margin-top:18mm;break-inside:avoid;page-break-inside:avoid}
  .print-sign div{border-top:.75pt solid #000;padding-top:3pt;text-align:center;font-size:8pt}
  .print-sign small{display:block;color:#555;font-size:7pt}
  .print-note{font-size:7.5pt;color:#444;margin-top:6pt}
  .counts{gap:4pt}.count{padding:2pt 6pt;font-size:8pt}
  h2,h3{break-after:avoid}
  dialog::backdrop{display:none}
  body:not([data-print="ficha"]) dialog{display:none!important}
  body[data-print="ficha"] #app{display:none!important}
  body[data-print="ficha"] #dlg{position:static;display:block;width:auto;max-width:none;max-height:none;border:0;margin:0;padding:0;overflow:visible;background:#fff;color:#000;transform:none}
  body[data-print="ficha"] .dlg{padding:0;gap:8pt}
  body[data-print="carnets"] #main>*:not(#idc){display:none!important}
  body[data-print="carnets"] #idc>*:not(.cards){display:none!important}
  body[data-print="carnets"] .cards{display:grid;grid-template-columns:repeat(2,85.6mm);gap:6mm 8mm;justify-content:center;padding-top:2mm}
  body[data-print="carnets"] .carnet{width:85.6mm;height:54mm;max-width:none;aspect-ratio:auto;border-radius:3mm;border:.3mm solid #B9C0CF;outline:.2mm dashed #8A92A6;outline-offset:1.8mm;break-inside:avoid;page-break-inside:avoid}
  .carnet .av{display:grid!important}
}

  const data=new TextEncoder().encode('libro-asistencia::'+txt);
  if(window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}}

}

function stats(id,desde,hasta){
  const s={P:0,A:0,T:0,J:0,total:0,racha:0};
  for(const f of fechasReg()){if(f<desde||f>hasta)continue;const e=estado(id,f);if(!e)continue;s[e]++;s.total++;s.racha=e==='A'?s.racha+1:(e==='J'?s.racha:0)}
  s.pct=s.total?(s.P+s.T)/s.total*100:null;return s;
}
function alertas(){
  const c=DB.config,h=hoy(),mesIni=h.slice(0,8)+'01',o=[];
  for(const e of estudiantesVisibles().filter(x=>x.estado==='activo')){
    const s=stats(e.id,c.inicio,h);
    if(s.racha>=c.consecutivas)o.push({nivel:'crit',tipo:'Inasistencias consecutivas',est:e,txt:`${s.racha} días seguidos sin justificar`,orden:0});
    if(s.total>=5&&s.pct<c.umbral)o.push({nivel:s.pct<c.umbral-10?'crit':'warn',tipo:'Asistencia baja',est:e,txt:`${pct(s.pct)} en el año (mínimo ${c.umbral} %)`,orden:s.pct<c.umbral-10?1:2});
    const m=stats(e.id,mesIni,h);
    if(m.T>=c.tardanzas)o.push({nivel:'warn',tipo:'Tardanzas reiteradas',est:e,txt:`${m.T} tardanzas en ${MESES[parse(h).getMonth()]}`,orden:3});

}

  c.lineWidth=Math.max(3,cv.width/220);c.strokeStyle=color;const r=14;c.beginPath();c.roundRect?c.roundRect(box.x,box.y,box.width,box.height,r):c.rect(box.x,box.y,box.width,box.height);c.stroke();
  if(label){c.save();c.translate(cv.width,0);c.scale(-1,1);const x=cv.width-box.x-box.width;c.font=`600 ${Math.round(cv.width/40)}px Figtree, sans-serif`;const w=c.measureText(label).width+20,h=Math.round(cv.width/28);

/* ---------- Control de entrada ---------- */
const K={ultimo:{},tVisto:{},tDesc:0};
function buscarCodigo(code){
  code=String(code||'').trim();if(!code)return null;
  const m=code.match(/^LA1-([A-Z0-9]{10})$/i);
  if(m)return {e:DB.estudiantes.find(e=>e.qr===m[1].toUpperCase()),via:'qr'};
  const e=DB.estudiantes.find(x=>x.nie&&x.nie===code)||DB.estudiantes.find(x=>x.reloj&&x.reloj===code);
  return e?{e,via:'manual'}:{e:null,via:'qr'};
}
function registrarEntrada(e,via,f=hoy(),hhmm=null){
  if(!e)return {t:'err',msg:'Código no reconocido',sub:'El carnet no pertenece a ningún estudiante registrado.'};
  if(e.estado!=='activo')return {t:'err',msg:'Estudiante retirado',e};
  if(!esLectivo(f))return {t:'err',msg:'No es día lectivo',sub:motivoNoLectivo(f),e};
  const s=sec(e.seccionId),ahora=hhmm||horaAhora();DB.asistencia[f]=DB.asistencia[f]||{};const r=DB.asistencia[f][e.id];
  if(r&&r.in&&r.e!=='A')return {t:'ya',msg:`Ya ingresó a las ${r.in}`,e,r};
  const lim=sumarMin(DB.config.entrada[s.turno]||'07:00',+DB.config.tolerancia||0);
  if(r&&r.e!=='A'&&!r.in){r.in=ahora;r.via=via;return {t:'ya',msg:`Lista ya tomada como ${ESTADOS[r.e].toLowerCase()}`,e,r,guardar:true}}
  const v=ahora<=lim?'P':'T';
  DB.asistencia[f][e.id]={e:v,h:v==='T'?ahora:'',o:r&&r.o||'',in:ahora,via};
  return {t:v,msg:v==='P'?'Ingreso a tiempo':'Tardanza',sub:v==='T'?`Límite ${lim} (${s.turno.toLowerCase()})`:`${s.turno} · entrada ${DB.config.entrada[s.turno]}`,e,h:ahora,guardar:true};
}
function procesar(e,via,codigo){
  const id=e?e.id:'?'+codigo,now=Date.now();
  if(K.tVisto[id]&&now-K.tVisto[id]<5000)return;K.tVisto[id]=now;
  const r=registrarEntrada(e,via);
  if(r.guardar){save();log(`Entrada ${VIAS[via]}: ${nombreEst(e)} (${ESTADOS[DB.asistencia[hoy()][e.id].e]})`)}
  mostrarResultado(r,via);beep(r.t==='ya'?'ya':r.t);
}
function mostrarResultado(r,via){
  const el=$('#kRes');if(!el)return;const s=r.e&&sec(r.e.seccionId);
  el.className='result pop r-'+(r.t==='P'||r.t==='T'?r.t:r.t);void el.offsetWidth;
  el.innerHTML=r.e?`${avatar(r.e)}<div style="min-width:0"><div class="result-s">${esc(r.msg)}${r.h?` · ${r.h}`:''}</div><div class="result-n">${esc(r.e.nombres)} ${esc(r.e.apellidos)}</div><div class="small muted">${esc(secNombre(s))}${r.sub?' · '+esc(r.sub):''} · ${VIAS[via]}</div></div>`
    :`<span class="av" style="background:var(--a);color:#fff">${ic('x',26,2.4)}</span><div><div class="result-s">${esc(r.msg)}</div><div class="small muted">${esc(r.sub||'')}</div></div>`;
  const fl=$('#kFlash');if(fl){fl.style.background=r.t==='P'?'#2FB36B':r.t==='T'?'#E3A33A':r.t==='err'?'#E2574E':'#6F8FEA';fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on')}
  pintarRecientes();
}

  const h=hoy(),a=DB.asistencia[h]||{},ests=DB.estudiantes.filter(e=>e.estado==='activo');
  const ing=ests.filter(e=>a[e.id]&&a[e.id].in).map(e=>({e,r:a[e.id]})).sort((x,y)=>y.r.in.localeCompare(x.r.in));
  const t=ing.filter(x=>x.r.e==='T').length,el=$('#kCount');if(!el)return;
  el.innerHTML=`<div class="panel-h"><div class="head-t"><span class="eyebrow">Ingresos de hoy</span><span class="metric-v" style="font-size:1.8rem">${ing.length}<small> / ${ests.length}</small></span></div><div class="counts"><span class="count k-P">A tiempo<b>${ing.length-t}</b></span><span class="count k-T">Tarde<b>${t}</b></span></div></div>
   <div class="progress" role="img" aria-label="${ing.length} de ${ests.length} estudiantes han ingresado"><i style="width:${ests.length?(ing.length-t)/ests.length*100:0}%;background:var(--p)"></i><i style="width:${ests.length?t/ests.length*100:0}%;background:var(--t)"></i></div>`;
  $('#kRec').innerHTML=ing.length?ing.slice(0,8).map(x=>`<div class="list-r"><div class="who">${avatar(x.e)}<div><div style="font-weight:600;font-size:.9rem">${esc(x.e.nombres)} ${esc(x.e.apellidos)}</div><div class="small muted">${esc(secNombre(sec(x.e.seccionId)))}</div></div></div><div style="text-align:right">${chipEstado(x.r.e)}<div class="via" style="justify-content:flex-end;margin-top:3px">${ic(x.r.via==='qr'?'qr':x.r.via==='rostro'?'face':x.r.via==='reloj'?'finger':'key',12)}${esc(x.r.in)}</div></div></div>`).join('')
    :`<div class="empty small">${ic('door',32,1.5)}Aún no hay ingresos registrados hoy.</div>`;
}

async function kIniciar(){
  const m=UI.k.modo,v=$('#kVideo'),idle=$('#kIdle'),msg=t=>{const e=$('#kMsg');if(e)e.textContent=t};
  idle.querySelector('button').disabled=true;idle.querySelector('p').textContent=m==='rostro'?'Preparando reconocimiento facial…':'Abriendo cámara…';
  try{
    if(m==='rostro')await cargarRostro();
    const gen=await abrirCamara(v,m==='qr'?'environment':'user');
    v.hidden=false;idle.hidden=true;$('#kFrame').hidden=false;$('#kStatus').hidden=false;audioOn();pedirWakeLock();
    if(m==='qr')loopQR(v,gen,msg);else loopRostro(v,gen,msg);
  }catch(e){idle.querySelector('p').textContent=e.message;idle.querySelector('button').disabled=false;toast(e.message,'err')}
}
async function loopQR(v,gen,msg){
  let det=null;if('BarcodeDetector' in window){try{const f=await BarcodeDetector.getSupportedFormats();if(f.includes('qr_code'))det=new BarcodeDetector({formats:['qr_code']})}catch(e){}}
  if(!det){msg('Cargando lector QR…');await cargarLib('jsqr')}
  msg('Acerque el código QR del carnet');
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const tick=async()=>{if(gen!==CAM.gen)return;try{if(v.readyState>=2){let code=null;
      if(det){const r=await det.detect(v);if(r[0])code=r[0].rawValue}
      else{const w=640,hh=Math.round(v.videoHeight/v.videoWidth*w)||480;cv.width=w;cv.height=hh;cx.drawImage(v,0,0,w,hh);const r=jsQR(cx.getImageData(0,0,w,hh).data,w,hh,{inversionAttempts:'dontInvert'});if(r)code=r.data}
      if(code){const b=buscarCodigo(code);procesar(b&&b.e,'qr',code)}}}catch(e){}
    if(gen===CAM.gen)CAM.loop=setTimeout(tick,160)};tick();
}
function loopRostro(v,gen,msg){
  const cands=DB.estudiantes.filter(e=>e.estado==='activo'&&e.rostro&&e.rostro.d);
  if(!cands.length){msg('Ningún estudiante tiene rostro registrado');toast('Registre rostros en Identificación antes de usar este modo.','err')}
  const matcher=cands.length?new faceapi.FaceMatcher(cands.map(e=>new faceapi.LabeledFaceDescriptors(e.id,[new Float32Array(e.rostro.d)])),+DB.config.umbralRostro||.5):null;
  const ov=$('#kOverlay'),opts=faceOpts();let prev=null,cnt=0;
  msg('Mire a la cámara');
  const tick=async()=>{if(gen!==CAM.gen)return;try{
    const r=await faceapi.detectSingleFace(v,opts).withFaceLandmarks().withFaceDescriptor();
    if(!r){dibujarCaja(ov,v,null);prev=null;cnt=0;msg('Mire a la cámara')}
    else if(matcher){const best=matcher.findBestMatch(r.descriptor);
      if(best.label!=='unknown'){const e=DB.estudiantes.find(x=>x.id===best.label);dibujarCaja(ov,v,r.detection.box,'#2FB36B',e.nombres.split(' ')[0]);
        if(best.label===prev)cnt++;else{prev=best.label;cnt=1}msg(`Verificando… ${Math.round((1-best.distance)*100)} %`);
        if(cnt>=2){procesar(e,'rostro');cnt=0;prev=null}}
      else{dibujarCaja(ov,v,r.detection.box,'#E2574E','No registrado');prev=null;cnt=0;msg('Rostro no reconocido');
        if(Date.now()-K.tDesc>6000){K.tDesc=Date.now();mostrarResultado({t:'err',msg:'Rostro no reconocido',sub:'Use el carnet QR o digite el NIE.'},'rostro');beep('err')}}}
    else dibujarCaja(ov,v,r.detection.box,'#6F8FEA');
  }catch(e){}if(gen===CAM.gen)CAM.loop=setTimeout(tick,300)};tick();
}

function procesarReloj(txt){
  const marcas={};let lineas=0;
  for(const ln of txt.split(/\r?\n/)){if(!ln.trim())continue;lineas++;
    let m=ln.match(/^\s*"?([A-Za-z0-9-]+)"?[\s,;]+(?:.*?[\s,;])?(\d{4})[-/](\d{2})[-/](\d{2})[ T,;]+(\d{1,2}):(\d{2})/);
    let id,f,hh;if(m){id=m[1];f=`${m[2]}-${m[3]}-${m[4]}`;hh=`${pad(m[5])}:${m[6]}`}
    else{m=ln.match(/^\s*"?([A-Za-z0-9-]+)"?[\s,;]+(?:.*?[\s,;])?(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,;]+(\d{1,2}):(\d{2})/);if(!m)continue;id=m[1];f=`${m[4]}-${pad(m[3])}-${pad(m[2])}`;hh=`${pad(m[5])}:${m[6]}`}
    const k=id+'|'+f;if(!marcas[k]||hh<marcas[k].hh)marcas[k]={id,f,hh}}
  const norm=x=>String(x||'').replace(/^0+/,'');const res={ok:0,ya:0,noLect:0,sinEst:new Set(),lineas};
  for(const k in marcas){const {id,f,hh}=marcas[k];const e=DB.estudiantes.find(x=>norm(x.reloj||x.nie)===norm(id)&&norm(id));
    if(!e){res.sinEst.add(id);continue}if(f>hoy())continue;const r=registrarEntrada(e,'reloj',f,hh);
    if(r.t==='P'||r.t==='T')res.ok++;else if(r.t==='ya')res.ya++;else res.noLect++}
  return res;
}

function datosResumen(desde,hasta){
  return seccionesVisibles().map(s=>{const ests=estudiantesDe(s.id);const t={P:0,A:0,T:0,J:0,n:0};const dias=new Set();
    for(const f of fechasReg()){if(f<desde||f>hasta)continue;if(DB.listas[f]&&DB.listas[f][s.id])dias.add(f);for(const e of ests){const v=estado(e.id,f);if(v){t[v]++;t.n++}}}
    return {s,ests,t,dias:dias.size,p:t.n?(t.P+t.T)/t.n*100:null}});
}

function dlgPass(u,modo){
  // modo: 'propia' (el usuario cambia la suya), 'forzada' (obligatoria al entrar), 'reset' (admin restablece a otro)
  const reset=modo==='reset',tmp=reset?passTemporal():'';
  dlg.dataset.lock=modo==='forzada'?'1':'';
  openDlg(`<div class="head-t"><span class="eyebrow">${reset?'Restablecer contraseña':modo==='forzada'?'Seguridad de la cuenta':'Mi cuenta'}</span><h2>${reset?esc(u.nombre):modo==='forzada'?'Cree una contraseña nueva':'Cambiar mi contraseña'}</h2>
    ${modo==='forzada'?'<p class="small muted">El administrador restableció su contraseña. Para continuar, elija una contraseña personal que solo usted conozca.</p>':''}</div>
   <form id="fPw" class="form" style="grid-template-columns:1fr">
    ${reset?`<div class="field"><label for="pN">Contraseña temporal</label><input id="pN" value="${tmp}" autocomplete="off"><span class="hint">Compártala con la persona. Puede cambiarla antes de guardar.</span></div>
      <label class="check"><input type="checkbox" id="pF" checked> Pedir que cree su propia contraseña al entrar</label>`
    :`${modo==='propia'?`<div class="field"><label for="pA">Contraseña actual</label><input id="pA" type="password" autocomplete="current-password" required></div>`:''}
      <div class="field"><label for="pN">Contraseña nueva</label><input id="pN" type="password" autocomplete="new-password" required><span class="hint">Mínimo ${MIN_PASS()} caracteres.</span></div>
      <div class="field"><label for="pC">Repita la contraseña nueva</label><input id="pC" type="password" autocomplete="new-password" required></div>`}
    <p class="err" id="pErr"></p>
    <div class="dlg-actions">${modo==='forzada'?'':'<button type="button" class="btn" data-act="cerrar">Cancelar</button>'}<button class="btn btn-primary">${reset?'Restablecer':'Guardar contraseña'}</button></div></form>`);
  $('#fPw').onsubmit=async ev=>{ev.preventDefault();const n=$('#pN').value,er=m=>$('#pErr').textContent=m;
    if(n.length<MIN_PASS())return er(`La contraseña debe tener al menos ${MIN_PASS()} caracteres.`);
    if(!reset){if(n!==$('#pC').value)return er('Las contraseñas no coinciden.');if(modo==='propia'&&await hash($('#pA').value)!==u.hash)return er('La contraseña actual no es correcta.');if(await hash(n)===u.hash)return er('Use una contraseña distinta a la anterior.')}
    u.hash=await hash(n);u.debeCambiar=reset?$('#pF').checked:false;
    log(reset?`Restableció la contraseña de ${u.usuario}`:`Cambió su contraseña`);save();dlg.dataset.lock='';closeDlg();
    if(reset){openDlg(`<div class="head-t"><span class="eyebrow">Contraseña restablecida</span><h2>${esc(u.nombre)}</h2></div><p class="small muted">Entregue estos datos a la persona. ${u.debeCambiar?'Al entrar, el sistema le pedirá crear su propia contraseña.':''}</p>
      <div class="creds" style="display:grid"><span>Usuario</span><b class="mono">${esc(u.usuario)}</b><span>Contraseña</span><b class="mono">${esc(n)}</b></div><div class="dlg-actions"><button class="btn btn-primary" data-act="cerrar">Listo</button></div>`);if(_vista==='admin')VIEWS.admin()}
    else toast('Contraseña actualizada.')};
}
dlg.addEventListener('cancel',e=>{if(dlg.dataset.lock==='1')e.preventDefault()});
function bindImport(){const inp=$('#impFile');if(!inp)return;inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=async()=>{
  let d;try{d=JSON.parse(rd.result)}catch(x){toast('El archivo no es un respaldo válido.','err');return}
  if(!d||!d.config||!Array.isArray(d.usuarios)||!Array.isArray(d.estudiantes)){toast('El archivo no tiene la estructura de un respaldo del Libro de Asistencia.','err');return}
  if(!await confirmar('¿Restaurar este respaldo?',`Reemplazará todos los datos actuales por los del archivo (${d.estudiantes.length} estudiantes, ${Object.keys(d.asistencia||{}).length} días con asistencia).`,'Restaurar',true))return;
  DB=Object.assign(dbVacia(),d);DB.config=Object.assign(configBase(),d.config);asegurarAdmin();save();const yo=DB.usuarios.find(u=>u.id===YO.id&&u.activo);toast('Respaldo restaurado.');if(yo){YO=yo;render()}else salir()};rd.readAsText(file)}}
function asegurarAdmin(){if(!DB.usuarios.length||DB.usuarios.some(u=>u.rol==='admin'))return false;const d=DB.usuarios.find(u=>u.rol==='direccion'&&u.activo)||DB.usuarios.find(u=>u.activo);if(!d)return false;
  d.rol='admin';DB.bitacora.unshift({at:new Date().toISOString(),u:'Sistema',acc:`Asignó el rol de Administrador del sistema a ${d.usuario} (no había superusuario)`});return true}
let _ultimaAct=Date.now();['pointerdown','keydown','touchstart'].forEach(t=>document.addEventListener(t,()=>{_ultimaAct=Date.now()},{passive:true}));
setInterval(()=>{if(!YO||!DB)return;const m=+DB.config.inactividad||0;if(!m||(_vista==='entrada'&&CAM.stream))return;if(Date.now()-_ultimaAct>m*60000){salir();toast('Sesión cerrada por inactividad.')}},20000);

  desbloquear:()=>{try{localStorage.removeItem(BKEY)}catch(e){}log('Desbloqueó el inicio de sesión');save();toast('Inicio de sesión desbloqueado.');VIEWS.admin()},
  toggleUsr:async b=>{const u=usuario(b.dataset.id);if(u.activo&&u.rol==='admin'&&adminsActivos().length<=1){toast('Debe quedar al menos un administrador activo.','err');return}
    u.activo=!u.activo;log(`${u.activo?'Activó':'Desactivó'} al usuario ${u.usuario}`);save();toast(`Usuario ${u.activo?'activado':'desactivado'}.`);VIEWS.admin()},

    const ss=DB.secciones.filter(s=>s.docenteId===u.id);if(!await confirmar('¿Eliminar usuario?',`Se eliminará la cuenta de ${u.nombre} (${u.usuario}).${ss.length?` Sus ${ss.length} secciones quedarán sin docente guía.`:''} Su historial en la bitácora se conserva.`,'Eliminar',true))return;

    const btn=w.querySelector('[data-act="pantallaCompleta"]');btn.innerHTML=ic('full',17)+(UI.k.full?'Salir de pantalla completa':'Pantalla completa')},
  cerrarJornada:async()=>{const h=hoy(),a=DB.asistencia[h]||{};const pend=DB.secciones.filter(s=>!(DB.listas[h]&&DB.listas[h][s.id])).map(s=>({s,falt:estudiantesDe(s.id).filter(e=>!a[e.id])}));

function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function semilla(){
  const db=dbVacia();db.demo=true;DB=db;const rnd=mulberry32(20261016),pick=a=>a[Math.floor(rnd()*a.length)],pass=await hash('1234');
  const U=(n,u,r)=>({id:uid(),nombre:n,usuario:u,rol:r,activo:true,hash:pass});
  const adm=U('Administrador General','admin','admin'),dir=U('Licda. Marta Ventura','direccion','direccion'),coo=U('Lic. Roberto Amaya','coordinacion','coordinacion'),d1=U('Profa. Karla Mejía','kmejia','docente'),d2=U('Prof. Daniel Portillo','dportillo','docente'),por=U('Sr. Julio Canales','porteria','porteria');
  db.usuarios=[adm,dir,coo,d1,d2,por];
  const S=(g,l,t,d)=>({id:uid(),grado:g,seccion:l,turno:t,docenteId:d.id});
  db.secciones=[S('Parvularia 6','A','Matutino',d1),S('3.er grado','A','Matutino',d1),S('7.° grado','B','Matutino',d2),S('1.er año de bachillerato','A','Vespertino',d2)];
  const AP=['Hernández','Martínez','López','García','Rodríguez','Flores','Romero','Ramírez','Cruz','Reyes','Mejía','Sorto','Guevara','Argueta','Chávez','Benítez','Granados','Lazo','Quintanilla','Villatoro','Canales','Fuentes'];
  const NM={M:['José Antonio','Carlos Eduardo','Kevin Alexander','Diego','Mateo','Josué David','Fernando','Óscar Armando','Luis Mario','Gabriel','Samuel','Ángel'],F:['María José','Andrea Sofía','Fátima','Valeria','Gabriela','Daniela','Karla Patricia','Sofía','Alejandra','Camila','Ximena','Marisol']};
  const NR=['Ana','Rosa','Carmen','Gloria','Silvia','Reina','Mirna','Patricia','Julio','Mauricio'];
  const usados=new Set();
  db.secciones.forEach((s,i)=>{for(let k=0;k<[9,10,11,10][i];k++){const sx=rnd()<.5?'M':'F';let ap,nm;do{ap=pick(AP)+' '+pick(AP);nm=pick(NM[sx])}while(usados.has(ap+nm)||ap.split(' ')[0]===ap.split(' ')[1]);usados.add(ap+nm);
    db.estudiantes.push({id:uid(),nie:String(4100000+Math.floor(rnd()*890000)),apellidos:ap,nombres:nm,sexo:sx,seccionId:s.id,encargado:pick(NR)+' '+ap.split(' ')[0],telefono:`${pick(['7','6'])}${Math.floor(100+rnd()*899)}-${Math.floor(1000+rnd()*8999)}`,estado:'activo',qr:token(),reloj:'',ingreso:db.config.inicio})}});
  const h=hoy(),dias=lectivosEntre(addDias(h,-45),addDias(h,-1)).slice(-18);
  const ec=s=>db.estudiantes.filter(e=>e.seccionId===db.secciones[s].id).sort(porNombre);
  const racha=ec(2)[3],baja=ec(3)[2],tarde=ec(1)[4],jus=ec(0)[1];
  dias.forEach((f,di)=>{db.asistencia[f]={};db.listas[f]={};
    db.secciones.forEach(s=>{db.listas[f][s.id]={por:s.docenteId,at:f+(s.turno==='Matutino'?'T07:40:00':'T13:25:00')}});
    db.estudiantes.forEach(e=>{const s=db.secciones.find(x=>x.id===e.seccionId),r=rnd();let v=r<.89?'P':r<.95?'T':'A';
      if(e===racha&&di>=dias.length-4)v='A';if(e===baja&&rnd()<.3)v='A';if(e===tarde&&rnd()<.35)v='T';if(e===jus&&(di===dias.length-6||di===dias.length-5))v='A';
      const hh=s.turno==='Matutino'?'07':'13',via=di>=dias.length-5&&s.turno==='Matutino'?(rnd()<.8?'qr':'manual'):'lista';
      const ing=v==='A'?'':v==='T'?`${hh}:${pad(11+Math.floor(rnd()*25))}`:`${s.turno==='Matutino'?'06':'12'}:${pad(35+Math.floor(rnd()*24))}`;
      db.asistencia[f][e.id]={e:v,h:v==='T'?ing:'',o:'',in:via==='lista'?'':ing,via}})});
  db.justificaciones.push({id:uid(),estudianteId:jus.id,desde:dias[dias.length-6],hasta:dias[dias.length-5],tipo:'Médico',documento:true,detalle:'Constancia de consulta por infección respiratoria',estado:'aprobada',por:d1.id,creada:dias[dias.length-4]+'T08:10:00.000Z'});
  db.justificaciones.push({id:uid(),estudianteId:racha.id,desde:dias[dias.length-1],hasta:dias[dias.length-1],tipo:'Familiar',documento:false,detalle:'La madre avisó por teléfono: viaje familiar a La Unión',estado:'pendiente',por:d2.id,creada:h+'T07:55:00.000Z'});
  if(esLectivo(h)){db.asistencia[h]={};db.listas[h]={};
    [0,2].forEach(si=>{const s=db.secciones[si];db.listas[h][s.id]={por:s.docenteId,at:new Date().toISOString()};
      ec(si).forEach(e=>{const r=rnd();let v=r<.9?'P':r<.96?'T':'A';if(e===racha)v='A';const ing=v==='A'?'':v==='T'?`07:${pad(11+Math.floor(rnd()*20))}`:`06:${pad(38+Math.floor(rnd()*21))}`;
        db.asistencia[h][e.id]={e:v,h:v==='T'?ing:'',o:'',in:ing,via:v==='A'?'lista':'qr'}})});
    ec(1).forEach((e,i)=>{if(i%4===3)return;const t=rnd()<.12;const ing=t?`07:${pad(11+Math.floor(rnd()*15))}`:`06:${pad(40+Math.floor(rnd()*19))}`;db.asistencia[h][e.id]={e:t?'T':'P',h:t?ing:'',o:'',in:ing,via:i%5===0?'manual':'qr'}})}
  db.bitacora=[{at:new Date().toISOString(),u:'Sistema',acc:'Cargó los datos de ejemplo'}];
  return db;
}

    let c=false;DB.estudiantes.forEach(e=>{if(!e.qr){e.qr=token();c=true}});if(c)save()}
  try{const id=sessionStorage.getItem(SKEY);YO=DB.usuarios.find(u=>u.id===id&&u.activo)||null}catch(e){}

})();
