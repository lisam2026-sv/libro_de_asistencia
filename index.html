<style>
/* Layout: barra lateral fija color tinta + área de trabajo; el registro mensual imita la cuadrícula del libro con su margen rojo; el control de entrada es un escenario oscuro de cámara. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#F8F9FC; --sunk:#ECEFF6; --ink:#111830; --ink-2:#39435F; --muted:#677190; --line:#E1E5EE; --line-2:#CBD2E0;
  --accent:#2A4DB5; --accent-2:#1F3D99; --accent-ink:#FFFFFF; --accent-soft:#E4E9FA; --margin:#C8423A;
  --p:#1F7A4A; --p-soft:#DCF1E4; --a:#C23B33; --a-soft:#F9E1DE; --t:#9A600A; --t-soft:#F7EACF; --j:#6550B0; --j-soft:#EAE5F8;
  --side-bg:#0E1530; --side-ink:#D3DAEE; --side-muted:#7E8AAE; --side-hover:#18224A; --side-active:#22306A; --side-line:#1E2850;
  --stage:#0A0F1F; --stage-ink:#E6EBF8; --stage-line:#26304F;
  --sh-1:0 1px 2px rgba(17,24,48,.05),0 1px 3px rgba(17,24,48,.05);
  --sh-2:0 12px 32px -10px rgba(17,24,48,.18),0 2px 6px rgba(17,24,48,.05);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Figtree','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B0F18; --surface:#131925; --surface-2:#171E2C; --sunk:#0F141F; --ink:#E7EBF5; --ink-2:#C2C9DB; --muted:#8B95AE; --line:#222B3C; --line-2:#2F3A50;
  --accent:#8CA6F2; --accent-2:#A4B9F6; --accent-ink:#0D1530; --accent-soft:#1C2647; --margin:#E2716A;
  --p:#5DC08B; --p-soft:#15301F; --a:#EE8077; --a-soft:#3A1B1A; --t:#E4B05A; --t-soft:#36290F; --j:#AE9DF0; --j-soft:#262042;
  --side-bg:#080C18; --side-hover:#121A33; --side-active:#1B2650; --side-line:#161E38;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 14px 36px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B0F18; --surface:#131925; --surface-2:#171E2C; --sunk:#0F141F; --ink:#E7EBF5; --ink-2:#C2C9DB; --muted:#8B95AE; --line:#222B3C; --line-2:#2F3A50;
  --accent:#8CA6F2; --accent-2:#A4B9F6; --accent-ink:#0D1530; --accent-soft:#1C2647; --margin:#E2716A;
  --p:#5DC08B; --p-soft:#15301F; --a:#EE8077; --a-soft:#3A1B1A; --t:#E4B05A; --t-soft:#36290F; --j:#AE9DF0; --j-soft:#262042;
  --side-bg:#080C18; --side-hover:#121A33; --side-active:#1B2650; --side-line:#161E38;
  --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 14px 36px -12px rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12;letter-spacing:-.015em}
h1{font-size:clamp(1.55rem,1.2rem + 1.2vw,2rem);font-weight:700}
h2{font-size:1.12rem;font-weight:700}
h3{font-size:.98rem;font-weight:700}
p{margin:0}
svg{flex-shrink:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
::selection{background:var(--accent-soft)}

/* ---------- Armazón ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:22px;
  padding-block:22px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;z-index:40}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:1.06rem;line-height:1.1;color:#fff}
.brand-s{font-size:.76rem;color:var(--side-muted);margin-top:2px}
.nav{display:flex;flex-direction:column;gap:16px;flex:1}
.nav-g{display:flex;flex-direction:column;gap:2px}
.nav-l{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);font-weight:600;padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:9px;color:var(--side-ink);text-decoration:none;font-weight:500;font-size:.93rem;transition:background .15s}
.nav a svg{opacity:.75}
.nav a:hover{background:var(--side-hover)}
.nav a[aria-current="page"]{background:var(--side-active);color:#fff;font-weight:600}
.nav a[aria-current="page"] svg{opacity:1;color:#9FB4F5}
.nav a .badge{margin-left:auto}
.badge{font-family:var(--f-mono);font-size:.7rem;font-weight:600;min-width:22px;text-align:center;padding:1px 7px;border-radius:99px;background:#E25B52;color:#fff;line-height:1.5}
.me{display:flex;align-items:center;gap:10px;padding:12px 8px 0;border-top:1px solid var(--side-line)}
.me-n{font-weight:600;font-size:.88rem;line-height:1.2;color:#fff}
.me-r{font-size:.76rem;color:var(--side-muted)}
.me .icon-btn{margin-left:auto;color:var(--side-muted)}
.me .icon-btn:hover{background:var(--side-hover);color:#fff}
.main{min-width:0;display:flex;flex-direction:column;gap:22px;padding-block:18px 56px;padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px));max-width:1440px;width:100%}
.top{display:flex;align-items:center;gap:10px;min-height:40px}
.top-date{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.86rem;font-weight:500}
.top-sp{flex:1}
.top .menu-btn{display:none}
.scrim{display:none}
.head{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:flex-end;justify-content:space-between}
.head-t{display:flex;flex-direction:column;gap:5px;min-width:0}
.head-t p{color:var(--muted);max-width:68ch}

@media (max-width:980px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(288px,86vw);transform:translateX(-102%);transition:transform .22s ease;padding-top:max(22px,env(safe-area-inset-top,0px))}
  .app.nav-open .side{transform:none;box-shadow:var(--sh-2)}
  .app.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:39}
  .top .menu-btn{display:inline-grid}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:18px}
}

/* ---------- Componentes ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--sh-1)}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel-h .head-t{gap:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:start;box-shadow:var(--sh-1)}
.metric-l{font-size:.8rem;color:var(--muted);font-weight:600}
.metric-v{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1.08;font-variant-numeric:tabular-nums;letter-spacing:-.02em;grid-column:1}
.metric-v small{font-size:1rem;color:var(--muted);font-weight:600}
.metric-s{font-size:.8rem;color:var(--muted);grid-column:1/-1}
.metric-i{grid-row:1/3;grid-column:2;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.metric-i.p{background:var(--p-soft);color:var(--p)}.metric-i.a{background:var(--a-soft);color:var(--a)}.metric-i.t{background:var(--t-soft);color:var(--t)}
.ring{grid-row:1/3;grid-column:2;--v:0;width:52px;height:52px;border-radius:50%;background:conic-gradient(var(--rc,var(--p)) calc(var(--v)*1%),var(--sunk) 0);display:grid;place-items:center}
.ring::after{content:"";width:38px;height:38px;border-radius:50%;background:var(--surface)}
.btn{font:inherit;font-weight:600;font-size:.88rem;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s;box-shadow:var(--sh-1)}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn-danger{background:var(--a);border-color:var(--a);color:#fff}
.btn-danger:hover{background:var(--a);filter:brightness(1.07)}
.btn-ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn-ghost:hover{background:var(--sunk);border-color:transparent}
.btn-sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn-lg{padding:11px 18px;font-size:.95rem}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.icon-btn:hover{background:var(--sunk);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.hint{font-size:.76rem;color:var(--muted)}
input,select,textarea{font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:9px;padding:8px 11px;min-width:0;max-width:100%;transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent);box-shadow:none}
textarea{min-height:120px;font-family:var(--f-mono);font-size:.84rem}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:11px;color:var(--muted);pointer-events:none}
.search input{padding-left:36px;width:100%}
.check{display:flex;gap:9px;align-items:flex-start;font-size:.9rem;line-height:1.35}
.check input{margin-top:1px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:14px}
.form .full{grid-column:1/-1}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;background:var(--sunk);color:var(--muted);line-height:1.6}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.85}
.chip.nodot::before{display:none}
.chip-ok{background:var(--p-soft);color:var(--p)}.chip-warn{background:var(--t-soft);color:var(--t)}.chip-crit{background:var(--a-soft);color:var(--a)}.chip-j{background:var(--j-soft);color:var(--j)}.chip-acc{background:var(--accent-soft);color:var(--accent)}
.via{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;color:var(--muted);font-family:var(--f-mono)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--t-soft);color:var(--ink);font-size:.88rem;line-height:1.45}
.note svg{color:var(--t);margin-top:1px}
.note-info{background:var(--accent-soft)}.note-info svg{color:var(--accent)}
.demo{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding:11px 14px 11px 16px;border-radius:var(--r);background:var(--accent-soft);font-size:.88rem;border:1px solid color-mix(in srgb,var(--accent) 22%,transparent)}
.empty{padding:32px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty svg{color:var(--line-2)}
.empty b{color:var(--ink)}
.av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:.74rem;font-weight:700;background:var(--accent-soft);color:var(--accent);object-fit:cover;letter-spacing:.02em}
.av-lg{width:64px;height:64px;font-size:1.2rem}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who>div{min-width:0}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--sh-1)}
.panel .tbl-wrap{box-shadow:none}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:.88rem}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.linkbtn{font:inherit;color:var(--ink);font-weight:600;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.linkbtn:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.pctbar{display:flex;align-items:center;gap:9px;min-width:130px}
.pctbar-t{flex:1;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.pctbar-f{height:100%;border-radius:99px;background:var(--p)}
.pctbar-f.warn{background:var(--t)}.pctbar-f.crit{background:var(--a)}

/* Segmentados y pestañas */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{font:inherit;font-weight:600;font-size:.9rem;display:inline-flex;align-items:center;gap:7px;padding:10px 14px;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.pill-tabs{display:inline-flex;padding:4px;border-radius:12px;background:var(--sunk);gap:2px;flex-wrap:wrap}
.pill-tabs button{font:inherit;font-weight:600;font-size:.86rem;display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:9px;border:0;background:none;color:var(--muted);cursor:pointer}
.pill-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}

/* Pase de lista */
.counts{display:flex;flex-wrap:wrap;gap:8px}
.count{display:flex;align-items:baseline;gap:7px;padding:6px 12px;border-radius:9px;font-weight:600;font-size:.84rem}
.count b{font-family:var(--f-mono);font-size:1.05rem}
.k-P{background:var(--p-soft);color:var(--p)}.k-A{background:var(--a-soft);color:var(--a)}.k-T{background:var(--t-soft);color:var(--t)}.k-J{background:var(--j-soft);color:var(--j)}
.roll{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);overflow:hidden;box-shadow:var(--sh-1)}
.roll-r{display:grid;grid-template-columns:30px minmax(0,1fr) auto minmax(0,270px);gap:14px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);border-left:3px solid transparent}
.roll-r:last-child{border-bottom:0}
.roll-r.is-A{background:color-mix(in srgb,var(--a-soft) 50%,transparent);border-left-color:var(--a)}
.roll-r.is-T{background:color-mix(in srgb,var(--t-soft) 50%,transparent);border-left-color:var(--t)}
.roll-r.is-J{background:color-mix(in srgb,var(--j-soft) 50%,transparent);border-left-color:var(--j)}
.roll-n{font-family:var(--f-mono);color:var(--muted);font-size:.82rem;text-align:right}
.roll-name{font-weight:600;line-height:1.25}
.roll-sub{font-size:.76rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:inherit;font-family:var(--f-mono);font-weight:600;width:42px;height:36px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:background .12s}
.seg button:last-child{border-right:0}
.seg button:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.seg button:disabled{cursor:not-allowed}
.seg button[aria-pressed="true"][data-v="P"]{background:var(--p);color:#fff}
.seg button[aria-pressed="true"][data-v="A"]{background:var(--a);color:#fff}
.seg button[aria-pressed="true"][data-v="T"]{background:var(--t);color:#fff}
.seg button[aria-pressed="true"][data-v="J"]{background:var(--j);color:#fff}
.roll-x{display:flex;gap:6px;min-width:0}
.roll-x input{flex:1;padding:6px 9px;font-size:.84rem}
.roll-x input[type="time"]{flex:0 0 110px}
.savebar{position:sticky;bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px 12px 18px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--sh-2);z-index:5}
@media (max-width:760px){.roll-r{grid-template-columns:26px minmax(0,1fr);row-gap:8px;padding:10px 12px}.roll-r .seg,.roll-r .roll-x{grid-column:2}}

/* Registro mensual */
.reg{font-size:.8rem}
.reg th,.reg td{padding:5px 6px;border-right:1px solid var(--line)}
.reg th.d,.reg td.d{text-align:center;width:30px;min-width:30px;font-family:var(--f-mono)}
.reg td.name{white-space:nowrap;border-right:2px solid var(--margin);position:sticky;left:0;background:var(--surface);z-index:1}
.reg th.name{border-right:2px solid var(--margin);position:sticky;left:0;z-index:2}
.reg tbody tr:hover td.name{background:var(--surface-2)}
.reg tfoot td.name{background:var(--surface-2)}
.reg .wd{display:block;font-size:.64rem;color:var(--muted);font-weight:500}
.c-P{color:var(--p)}.c-A{color:var(--a);background:var(--a-soft);font-weight:700}.c-T{color:var(--t);background:var(--t-soft);font-weight:700}.c-J{color:var(--j);background:var(--j-soft);font-weight:700}
.c-0{color:var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--muted)}

/* Gráfico */
.bars{display:grid;grid-template-columns:30px minmax(0,1fr);gap:8px}
.bars-y{display:flex;flex-direction:column;justify-content:space-between;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);text-align:right;height:160px;margin-top:-6px;padding-bottom:0}
.bars-plot{position:relative;height:160px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line-2);
  background:linear-gradient(var(--line),var(--line)) 0 0/100% 1px no-repeat,linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.bar-f{width:100%;max-width:38px;border-radius:6px 6px 0 0;background:linear-gradient(to top,var(--accent),color-mix(in srgb,var(--accent) 70%,var(--surface)))}
.bar-f.warn{background:var(--t)}
.bar-v{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-2);margin-bottom:4px;font-weight:600}
.bars-x{grid-column:2;display:flex;gap:8px}
.bars-x span{flex:1;text-align:center;font-family:var(--f-mono);font-size:.66rem;color:var(--muted);min-width:0}

.list{display:flex;flex-direction:column}
.list-r{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-r:last-child{border-bottom:0}
.list-r>div{min-width:0}

/* ---------- Control de entrada ---------- */
.kiosk{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:20px;align-items:start}
.stage-wrap{display:flex;flex-direction:column;gap:12px;min-width:0}
.stage{position:relative;border-radius:20px;overflow:hidden;background:var(--stage);aspect-ratio:4/3;max-width:100%;color:var(--stage-ink);box-shadow:var(--sh-2)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stage.mirror video,.stage.mirror canvas{transform:scaleX(-1)}
.stage-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  background:radial-gradient(120% 80% at 50% 0%,#18224A 0%,var(--stage) 60%)}
.stage-idle p{color:#AEB8D6;max-width:40ch;font-size:.92rem}
.stage-idle svg{color:#7F95DA}
.frame{position:absolute;inset:16% 22%;pointer-events:none}
.stage.face .frame{inset:12% 28%;border-radius:44% 44% 40% 40%;border:2px dashed rgba(255,255,255,.35)}
.frame i{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.9}
.frame i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.frame i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.frame i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.frame i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.stage.face .frame i{display:none}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#8FB0FF,transparent);box-shadow:0 0 12px #8FB0FF;top:50%}
@media (prefers-reduced-motion:no-preference){.scanline{animation:scan 2.2s ease-in-out infinite}@keyframes scan{0%,100%{top:4%}50%{top:96%}}}
.stage-status{position:absolute;left:14px;bottom:14px;right:14px;display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:.8rem;pointer-events:none}
.stage-status span{background:rgba(6,10,22,.72);backdrop-filter:blur(6px);padding:5px 11px;border-radius:99px;color:#DCE3F6}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0}
.flash.on{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}
.wedge{display:flex;gap:8px;align-items:center}
.wedge .search{flex:1}
.k-side{display:flex;flex-direction:column;gap:16px;min-width:0}
.clock{display:flex;flex-direction:column;gap:2px}
.clock-t{font-family:var(--f-display);font-size:clamp(2.6rem,2rem + 2vw,3.6rem);font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.result{border-radius:var(--r-lg);padding:18px;display:flex;gap:16px;align-items:center;border:1px solid var(--line);background:var(--surface);min-height:112px;box-shadow:var(--sh-1);transition:background .2s,border-color .2s}
.result .av{width:72px;height:72px;font-size:1.3rem}
.result-n{font-family:var(--f-display);font-size:1.25rem;font-weight:700;line-height:1.15}
.result.r-P{background:var(--p-soft);border-color:color-mix(in srgb,var(--p) 40%,transparent)}
.result.r-T{background:var(--t-soft);border-color:color-mix(in srgb,var(--t) 40%,transparent)}
.result.r-err{background:var(--a-soft);border-color:color-mix(in srgb,var(--a) 40%,transparent)}
.result.r-ya{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.result-s{font-weight:700;font-size:.95rem}
.r-P .result-s{color:var(--p)}.r-T .result-s{color:var(--t)}.r-err .result-s{color:var(--a)}.r-ya .result-s{color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.result.pop{animation:pop .35s ease-out}@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:none}}}
.progress{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.progress i{display:block;height:100%}
.kiosk-full{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 20px max(20px,env(safe-area-inset-left,0px))}
@media (max-width:900px){.kiosk{grid-template-columns:minmax(0,1fr)}}

/* Carnets */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:16px}
.carnet{aspect-ratio:85.6/54;max-width:100%;border-radius:14px;overflow:hidden;background:#fff;color:#111830;border:1px solid #D9DEEA;display:grid;grid-template-rows:auto 1fr auto;box-shadow:var(--sh-1);-webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid}
.carnet-h{background:#0E1530;color:#fff;padding:7px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;font-weight:600;letter-spacing:.02em}
.carnet-h b{font-family:var(--f-display);font-size:.82rem;letter-spacing:0}
.carnet-b{display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:10px;padding:10px 12px;align-items:center;min-height:0}
.carnet-b .av{width:46px;height:46px;font-size:.9rem;background:#E4E9FA;color:#2A4DB5}
.carnet-n{font-family:var(--f-display);font-weight:700;font-size:.92rem;line-height:1.12;margin-top:6px}
.carnet-g{font-size:.72rem;color:#4A5370;margin-top:2px}
.carnet-nie{font-family:var(--f-mono);font-size:.68rem;color:#4A5370;margin-top:4px}
.carnet-qr svg{width:100%;height:auto;display:block}
.carnet-f{font-size:.6rem;color:#677190;padding:4px 12px 6px;border-top:1px dashed #D9DEEA;display:flex;justify-content:space-between}

/* Diálogos */
dialog{border:1px solid var(--line);border-radius:18px;padding:0;background:var(--surface);color:var(--ink);width:min(660px,calc(100vw - 32px));max-height:calc(100vh - 48px);box-shadow:var(--sh-2)}
dialog::backdrop{background:rgba(8,12,26,.55);backdrop-filter:blur(2px)}
@media (prefers-reduced-motion:no-preference){dialog[open]{animation:dlg .18s ease-out}@keyframes dlg{from{transform:translateY(8px) scale(.99);opacity:0}}}
.dlg{padding:24px;display:flex;flex-direction:column;gap:16px}
.dlg-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
#dlg2{width:min(460px,calc(100vw - 32px))}

/* ---------- Acceso ---------- */
.login{position:relative;min-height:100vh;min-height:100dvh;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(380px,1fr);background:#0B1126;isolation:isolate;overflow:hidden}
.lg-bg{position:absolute;inset:0;z-index:-2;overflow:hidden;background:radial-gradient(80% 70% at 30% 40%,#1B2A62,#0B1126)}
.lg-slide{position:absolute;inset:-6%;background-size:cover;background-position:center;opacity:0;filter:blur(3.5px) saturate(1.12) brightness(.86);transform:scale(1.05);transition:opacity 1.6s ease}
.lg-slide.on{opacity:1}
.lg-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(9,14,34,.6) 0%,rgba(9,14,34,.25) 55%,rgba(9,14,34,.45) 100%),radial-gradient(60% 60% at 30% 45%,rgba(9,14,34,0),rgba(9,14,34,.45))}
.login-art{position:relative;color:#fff;display:flex;flex-direction:column;justify-content:space-between;gap:28px;
  padding-top:max(32px,env(safe-area-inset-top,0px));padding-bottom:max(30px,env(safe-area-inset-bottom,0px));padding-left:max(44px,env(safe-area-inset-left,0px));padding-right:44px}
.la-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.la-sys{display:flex;align-items:center;gap:10px;font-weight:600;font-size:.92rem;color:#E4E9FA}
.la-sys svg{color:#9FB4F5}
.la-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:rgba(9,14,34,.45);border:1px solid rgba(255,255,255,.16);font-family:var(--f-mono);font-size:.82rem;color:#E4E9FA;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.la-pill i{width:7px;height:7px;border-radius:50%;background:#5DC08B;box-shadow:0 0 0 0 rgba(93,192,139,.6)}
.la-mid{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;margin:auto 0}
.la-name{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,1.3rem + 2.4vw,3.3rem);letter-spacing:-.03em;line-height:1;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.45)}
.la-lema{font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:#C9D4F6;font-weight:600;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.la-year{font-size:.86rem;color:#B9C4E4}
.la-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.la-cap{display:inline-flex;align-items:center;gap:8px;font-size:.84rem;color:#E4E9FA;padding:7px 12px;border-radius:10px;background:rgba(9,14,34,.45);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:opacity .4s}
.la-cap.x{opacity:0}
.la-dots{display:flex;gap:6px}
.la-dots button{width:26px;height:4px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.28);cursor:pointer;overflow:hidden;position:relative}
.la-dots button.on{background:rgba(255,255,255,.28)}
.la-dots button.on::after{content:"";position:absolute;inset:0;background:#fff;transform-origin:left}
.login-form{position:relative;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 93%,transparent);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);border-left:1px solid rgba(255,255,255,.12);
  padding-top:max(72px,env(safe-area-inset-top,0px));padding-bottom:max(36px,env(safe-area-inset-bottom,0px));padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
.login-tools{position:absolute;top:max(18px,env(safe-area-inset-top,0px));right:max(18px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:center}
.login-card{width:min(400px,100%);display:flex;flex-direction:column;gap:22px}
.login-card .lt{font-size:1.9rem}

async function hash(txt){
  const data=new TextEncoder().encode('libro-asistencia::'+txt);
  if(window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){}}
  let h=2166136261;for(const c of data){h^=c;h=Math.imul(h,16777619)}return 'f'+(h>>>0).toString(16);
}

/* ---------- Reglas de asistencia ---------- */
const justificada=(id,f)=>DB.justificaciones.some(j=>j.estudianteId===id&&j.estado==='aprobada'&&f>=j.desde&&f<=j.hasta);
function estado(id,f){const r=DB.asistencia[f]&&DB.asistencia[f][id];if(!r)return null;if(r.e==='A'&&justificada(id,f))return 'J';return r.e}
function stats(id,desde,hasta){
  const s={P:0,A:0,T:0,J:0,total:0,racha:0};
  for(const f of fechasReg()){if(f<desde||f>hasta)continue;const e=estado(id,f);if(!e)continue;s[e]++;s.total++;s.racha=e==='A'?s.racha+1:(e==='J'?s.racha:0)}
  s.pct=s.total?(s.P+s.T)/s.total*100:null;return s;
}
function alertas(){
  const c=DB.config,h=hoy(),mesIni=h.slice(0,8)+'01',o=[];
  for(const e of estudiantesVisibles().filter(x=>x.estado==='activo')){
    const s=stats(e.id,c.inicio,h);
    if(s.racha>=c.consecutivas)o.push({nivel:'crit',tipo:'Inasistencias consecutivas',est:e,txt:`${s.racha} días seguidos sin justificar`,orden:0});
    if(s.total>=5&&s.pct<c.umbral)o.push({nivel:s.pct<c.umbral-10?'crit':'warn',tipo:'Asistencia baja',est:e,txt:`${pct(s.pct)} en el año (mínimo ${c.umbral} %)`,orden:s.pct<c.umbral-10?1:2});
    const m=stats(e.id,mesIni,h);
    if(m.T>=c.tardanzas)o.push({nivel:'warn',tipo:'Tardanzas reiteradas',est:e,txt:`${m.T} tardanzas en ${MESES[parse(h).getMonth()]}`,orden:3});
  }
  return o.sort((a,b)=>a.orden-b.orden);
}

function loopRostro(v,gen,msg){

  const ov=$('#kOverlay'),opts=faceOpts();let prev=null,cnt=0;

    else dibujarCaja(ov,v,r.detection.box,'#6F8FEA');
  }catch(e){}if(gen===CAM.gen)CAM.loop=setTimeout(tick,300)};tick();
}

function procesarReloj(txt){
  const marcas={};let lineas=0;
  for(const ln of txt.split(/\r?\n/)){if(!ln.trim())continue;lineas++;
    let m=ln.match(/^\s*"?([A-Za-z0-9-]+)"?[\s,;]+(?:.*?[\s,;])?(\d{4})[-/](\d{2})[-/](\d{2})[ T,;]+(\d{1,2}):(\d{2})/);
    let id,f,hh;if(m){id=m[1];f=`${m[2]}-${m[3]}-${m[4]}`;hh=`${pad(m[5])}:${m[6]}`}
    else{m=ln.match(/^\s*"?([A-Za-z0-9-]+)"?[\s,;]+(?:.*?[\s,;])?(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,;]+(\d{1,2}):(\d{2})/);if(!m)continue;id=m[1];f=`${m[4]}-${pad(m[3])}-${pad(m[2])}`;hh=`${pad(m[5])}:${m[6]}`}
    const k=id+'|'+f;if(!marcas[k]||hh<marcas[k].hh)marcas[k]={id,f,hh}}
  const norm=x=>String(x||'').replace(/^0+/,'');const res={ok:0,ya:0,noLect:0,sinEst:new Set(),lineas};
  for(const k in marcas){const {id,f,hh}=marcas[k];const e=DB.estudiantes.find(x=>norm(x.reloj||x.nie)===norm(id)&&norm(id));
    if(!e){res.sinEst.add(id);continue}if(f>hoy())continue;const r=registrarEntrada(e,'reloj',f,hh);
    if(r.t==='P'||r.t==='T')res.ok++;else if(r.t==='ya')res.ya++;else res.noLect++}
  return res;
}

function datosMensual(secId,mes){

  const filas=ests.map(e=>{const c={P:0,A:0,T:0,J:0,n:0};const cel=dias.map(f=>{const v=estado(e.id,f);if(v){c[v]++;c.n++}return v||(f<=h?'·':'')});return {e,cel,c,p:c.n?(c.P+c.T)/c.n*100:null}});

function repResumen(){
  const r=UI.rep,h=hoy();if(!r.desde)r.desde=h.slice(0,8)+'01';if(!r.hasta)r.hasta=h;
  const rows=datosResumen(r.desde,r.hasta),T={P:0,A:0,T:0,J:0,n:0};rows.forEach(x=>['P','A','T','J','n'].forEach(k=>T[k]+=x.t[k]));
  $('#rep').innerHTML=`<div class="toolbar no-print">
   <div class="field"><label for="rD">Desde</label><input type="date" id="rD" value="${r.desde}"></div><div class="field"><label for="rH">Hasta</label><input type="date" id="rH" value="${r.hasta}"></div>
   <div class="row"><button class="btn" data-act="csvResumen">${ic('dl',16)}Exportar a Excel</button><button class="btn" data-act="imprimir">${ic('print',16)}Imprimir</button></div></div>
  <div class="panel">${printHead('Resumen de asistencia por sección',`Período del ${fCorta(r.desde)} al ${fCorta(r.hasta)} · ${rows.length} secciones`)}<div class="head-t no-print"><span class="eyebrow">${esc(DB.config.institucion)}</span><h2>Resumen de asistencia del ${fCorta(r.desde)} al ${fCorta(r.hasta)}</h2></div>
  <div class="tbl-wrap"><table><thead><tr><th>Sección</th><th>Docente guía</th><th class="n">Matrícula</th><th class="n">Días con lista</th><th>Asistencia</th><th class="n">Ausencias</th><th class="n">Justificadas</th><th class="n">Tardanzas</th></tr></thead><tbody>
   ${rows.map(x=>`<tr><td style="font-weight:600">${esc(secNombre(x.s))}</td><td class="small">${esc((usuario(x.s.docenteId)||{}).nombre||'—')}</td><td class="n">${x.ests.length}</td><td class="n">${x.dias}</td><td>${pctBar(x.p)}</td><td class="n">${x.t.A}</td><td class="n">${x.t.J}</td><td class="n">${x.t.T}</td></tr>`).join('')}
  </tbody><tfoot><tr><td colspan="2">Total</td><td class="n">${rows.reduce((a,x)=>a+x.ests.length,0)}</td><td></td><td class="num">${pct(T.n?(T.P+T.T)/T.n*100:null)}</td><td class="n">${T.A}</td><td class="n">${T.J}</td><td class="n">${T.T}</td></tr></tfoot></table></div>
  <p class="small muted">Asistencia = (presentes + tardanzas) ÷ registros del período. Las ausencias justificadas no cuentan como asistencia, pero tampoco generan alerta de inasistencia consecutiva.</p>${printSign(['Coordinación académica'],['Dirección'])}</div>`;
  $('#rD').onchange=e=>{if(e.target.value){r.desde=e.target.value;repResumen()}};$('#rH').onchange=e=>{if(e.target.value){r.hasta=e.target.value;repResumen()}};
}
function repAlertas(){
  const al=alertas(),c=DB.config;
  $('#rep').innerHTML=`<div class="toolbar no-print"><p class="small muted" style="flex:1;max-width:70ch">Criterios: asistencia anual menor a ${c.umbral} %, ${c.consecutivas} o más inasistencias seguidas sin justificar, o ${c.tardanzas} o más tardanzas en el mes. Se ajustan en Configuración.</p>
   <div class="row"><button class="btn" data-act="csvAlertas" ${al.length?'':'disabled'}>${ic('dl',16)}Exportar a Excel</button><button class="btn" data-act="imprimir">${ic('print',16)}Imprimir</button></div></div>
  ${printHead('Estudiantes con alertas de asistencia',`Criterios: asistencia anual menor a ${c.umbral} %, ${c.consecutivas} o más inasistencias seguidas sin justificar o ${c.tardanzas} o más tardanzas en el mes · ${al.length} alertas`)}
  ${al.length?`<div class="tbl-wrap"><table><thead><tr><th>Prioridad</th><th>Estudiante</th><th>Alerta</th><th>Detalle</th><th>Responsable</th></tr></thead><tbody>
   ${al.map(a=>`<tr><td><span class="chip ${a.nivel==='crit'?'chip-crit':'chip-warn'}">${a.nivel==='crit'?'Alta':'Media'}</span></td><td><div class="who">${avatar(a.est)}<div><button class="linkbtn" data-act="ficha" data-id="${a.est.id}">${esc(nombreEst(a.est))}</button><div class="small muted">${esc(secNombre(sec(a.est.seccionId)))}</div></div></div></td><td>${esc(a.tipo)}</td><td class="small">${esc(a.txt)}</td><td class="small">${esc(a.est.encargado)}<div class="mono muted">${esc(a.est.telefono)}</div></td></tr>`).join('')}
  </tbody></table></div>${printSign(['Orientación / Coordinación'],['Dirección'])}`:`<div class="panel"><div class="empty">${ic('check',36,1.5)}<b>Sin alertas activas</b></div></div>`}`;
}

  </tbody></table></div></section>`);

function formUsr(u){
  const nuevo=!u;u=u||{nombre:'',usuario:'',rol:'docente',activo:true};const yo=u.id===YO.id;
  openDlg(`<h2>${nuevo?'Nuevo usuario':'Editar usuario'}</h2><form id="fUsr" class="form">
   <div class="field full"><label for="uN">Nombre completo</label><input id="uN" value="${esc(u.nombre)}" placeholder="Profa. Ana Romero" required></div>
   <div class="field"><label for="uU">Usuario</label><input id="uU" value="${esc(u.usuario)}" autocomplete="off" required></div>
   <div class="field"><label for="uR">Rol</label><select id="uR" ${yo?'disabled':''}>${Object.keys(ROLES).filter(r=>r!=='admin'||YO.rol==='admin').map(r=>`<option value="${r}" ${r===u.rol?'selected':''}>${ROLES[r]}</option>`).join('')}</select></div>
   <div class="field"><label for="uP">${nuevo?'Contraseña':'Nueva contraseña'}</label><input id="uP" type="password" autocomplete="new-password" ${nuevo?'required':''} placeholder="${nuevo?`Mínimo ${MIN_PASS()} caracteres`:'Dejar vacío para no cambiarla'}"></div>
   <label class="check" style="align-self:end;padding-bottom:9px"><input type="checkbox" id="uA" ${u.activo?'checked':''} ${yo?'disabled':''}> Usuario activo</label>
   <p class="err full" id="uErr"></p>
   <div class="dlg-actions full"><button type="button" class="btn" data-act="cerrar">Cancelar</button><button class="btn btn-primary">${nuevo?'Crear usuario':'Guardar'}</button></div></form>`);
  $('#fUsr').onsubmit=async ev=>{ev.preventDefault();
    const d={nombre:$('#uN').value.trim(),usuario:$('#uU').value.trim().toLowerCase(),rol:yo?u.rol:$('#uR').value,activo:yo?true:$('#uA').checked},p=$('#uP').value;
    if(DB.usuarios.some(x=>x.usuario===d.usuario&&x.id!==(u.id||''))){$('#uErr').textContent='Ese nombre de usuario ya está en uso.';return}
    if(p&&p.length<MIN_PASS()){$('#uErr').textContent=`La contraseña debe tener al menos ${MIN_PASS()} caracteres.`;return}
    if(!nuevo&&u.rol==='admin'&&(d.rol!=='admin'||!d.activo)&&adminsActivos().length<=1){$('#uErr').textContent='Debe quedar al menos un administrador activo.';return}
    if(nuevo)DB.usuarios.push({id:uid(),...d,hash:await hash(p)});
    else{const t=usuario(u.id);Object.assign(t,d);if(p)t.hash=await hash(p);if(yo)YO=t}
    log(`${nuevo?'Creó':'Editó'} el usuario ${d.usuario}`);save();closeDlg();toast('Usuario guardado.');render();
  };
}

/* ---------- Panel de administrador ---------- */
const MIN_PASS=()=>+DB.config.minPass||4;
const adminsActivos=()=>DB.usuarios.filter(u=>u.rol==='admin'&&u.activo);
const tamKB=o=>{try{return Math.round(JSON.stringify(o||'').length*2/1024)}catch(e){return 0}};
const passTemporal=()=>'LSM-'+String(Math.floor(1000+Math.random()*9000));
VIEWS.admin=()=>{
  const c=DB.config,act=DB.usuarios.filter(u=>u.activo).length,tot=tamKB(DB),lim=5000;
  const rost=DB.estudiantes.reduce((a,e)=>a+(e.rostro?tamKB(e.rostro):0),0);
  const partes=[['Asistencia diaria',tamKB(DB.asistencia)+tamKB(DB.listas)],['Estudiantes',Math.max(0,tamKB(DB.estudiantes)-rost)],['Rostros registrados',rost],['Bitácora',tamKB(DB.bitacora)],['Configuración y logo',tamKB(DB.config)]];
  let bloq=0;try{bloq=+(localStorage.getItem(BKEY)||0)-Date.now()}catch(e){}
  const f=UI.bit||(UI.bit={q:'',u:''});

  const usuariosBit=[...new Set(DB.bitacora.map(x=>x.u))];
  main(`${cabecera('Superusuario · control total','Panel de administrador',`<button class="btn" data-act="exportar">${ic('dl',17)}Respaldo</button><button class="btn btn-primary" data-act="nuevoUsr">${ic('plus',17)}Nuevo usuario</button>`,'Cuentas y accesos, seguridad, identidad institucional, datos y bitácora completa del sistema.')}

    <div class="metric"><span class="metric-l">Usuarios activos</span><span class="metric-v">${act}<small> / ${DB.usuarios.length}</small></span><span class="metric-i">${ic('ucog',20)}</span><span class="metric-s">${adminsActivos().length} administrador${adminsActivos().length===1?'':'es'}</span></div>
    <div class="metric"><span class="metric-l">Estudiantes</span><span class="metric-v">${DB.estudiantes.filter(e=>e.estado==='activo').length}</span><span class="metric-i p">${ic('users',20)}</span><span class="metric-s">${DB.secciones.length} secciones · ${DB.estudiantes.filter(e=>e.rostro).length} con rostro</span></div>
    <div class="metric"><span class="metric-l">Días con asistencia</span><span class="metric-v">${Object.keys(DB.asistencia).length}</span><span class="metric-i t">${ic('lista',20)}</span><span class="metric-s">${DB.bitacora.length} movimientos en bitácora</span></div>
    <div class="metric"><span class="metric-l">Almacenamiento</span><span class="metric-v">${Math.round(tot/lim*100)}<small> %</small></span><span class="ring" style="--v:${Math.min(100,tot/lim*100)};--rc:${tot/lim>.8?'var(--a)':tot/lim>.6?'var(--t)':'var(--accent)'}"></span><span class="metric-s">${tot.toLocaleString('es-SV')} KB de ~${lim.toLocaleString('es-SV')} KB</span></div>
  </section>
  ${bloq>0?`<div class="note">${ic('lock',18)}<span><b>El inicio de sesión está bloqueado</b> por intentos fallidos (${Math.ceil(bloq/1000)} s restantes). <button class="btn btn-sm" data-act="desbloquear" style="margin-left:8px">Desbloquear ahora</button></span></div>`:''}
  <section class="panel"><div class="panel-h"><div class="head-t"><h2>Usuarios y accesos</h2><span class="small muted">Cambie roles, restablezca contraseñas, active o elimine cuentas. Siempre debe quedar al menos un administrador activo.</span></div></div>
   <div class="tbl-wrap"><table><thead><tr><th>Usuario</th><th>Rol</th><th>Estado</th><th>Último acceso</th><th></th></tr></thead><tbody>
   ${DB.usuarios.map(u=>{const yo=u.id===YO.id;return `<tr><td><div class="who"><span class="av ${u.rol==='admin'?'crown':''}">${esc(iniciales(u.nombre))}</span><div><div style="font-weight:600">${esc(u.nombre)}${yo?' <span class="chip chip-acc nodot">Usted</span>':''}${u.debeCambiar?' <span class="chip chip-warn nodot">Cambio de clave pendiente</span>':''}</div><div class="mono small muted">${esc(u.usuario)}</div></div></div></td>
    <td><select class="adm-role" data-id="${u.id}" aria-label="Rol de ${esc(u.nombre)}" ${yo?'disabled':''}>${Object.keys(ROLES).map(r=>`<option value="${r}" ${r===u.rol?'selected':''}>${ROLES[r]}</option>`).join('')}</select></td>
    <td>${u.activo?'<span class="chip chip-ok">Activo</span>':'<span class="chip">Inactivo</span>'}</td>
    <td class="small muted">${u.ultimo?new Date(u.ultimo).toLocaleString('es-SV',{dateStyle:'short',timeStyle:'short'}):'Nunca'}</td>
    <td><div class="row" style="flex-wrap:nowrap;justify-content:flex-end"><button class="btn btn-sm" data-act="resetPass" data-id="${u.id}">${ic('key',14)}Restablecer clave</button>
     ${yo?'':`<button class="btn btn-sm btn-ghost" data-act="toggleUsr" data-id="${u.id}">${u.activo?'Desactivar':'Activar'}</button><button class="btn btn-sm btn-ghost" data-act="borrarUsr" data-id="${u.id}" style="color:var(--a)">Eliminar</button>`}</div></td></tr>`}).join('')}
   </tbody></table></div></section>
  <div class="grid2">
   <section class="panel"><h2>Identidad institucional</h2>
    <div class="logo-prev">${crestHTML(96)}<div class="small muted" style="flex:1;min-width:200px">Aparece en la pantalla de bienvenida, el acceso, la barra lateral, los carnets e impresiones. Use un PNG con fondo transparente.</div></div>
    <form id="fId" class="form">
     <div class="field full"><label for="aI">Nombre de la institución</label><input id="aI" value="${esc(c.institucion)}" required></div>
     <div class="field full"><label for="aL">Lema</label><input id="aL" value="${esc(c.lema||'')}" placeholder="Libertad, Ciencia y Fe"></div>
     <div class="field full"><span class="lbl">Logo</span><div class="row"><label class="btn" for="aLogo">${ic('up',16)}Cambiar logo</label><input type="file" id="aLogo" accept="image/png,image/jpeg,image/webp" hidden>${c.logo?`<button type="button" class="btn btn-ghost" data-act="logoDef">Restaurar escudo original</button>`:''}</div></div>
     <div class="dlg-actions full"><button class="btn btn-primary">Guardar identidad</button></div></form></section>
   <section class="panel"><h2>Seguridad</h2><form id="fSeg" class="form">
     <div class="field"><label for="aMin">Longitud mínima de contraseña</label><select id="aMin">${[4,6,8,10].map(n=>`<option value="${n}" ${MIN_PASS()===n?'selected':''}>${n} caracteres</option>`).join('')}</select></div>
     <div class="field"><label for="aIn">Cerrar sesión por inactividad</label><select id="aIn">${[[0,'Nunca'],[10,'10 minutos'],[15,'15 minutos'],[30,'30 minutos'],[60,'1 hora']].map(o=>`<option value="${o[0]}" ${(+c.inactividad||0)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select><span class="hint">El Control de entrada con cámara activa no se cierra.</span></div>
     <label class="check full"><input type="checkbox" id="aDoc" ${c.docenteEditaAnteriores?'checked':''}> Docentes pueden corregir listas de días anteriores</label>
     <div class="dlg-actions full"><button class="btn btn-primary">Guardar seguridad</button></div></form>
     <p class="small muted">Los datos viven en este equipo: quien tenga acceso al navegador podría manipularlos con herramientas técnicas. Proteja el equipo con contraseña de Windows o bloqueo de pantalla.</p></section>
  </div>
  <section class="panel"><div class="panel-h"><h2>Datos del sistema</h2><span class="chip nodot mono">${tot.toLocaleString('es-SV')} KB</span></div>
   <div class="store">${partes.map(p=>`<div class="store-r"><span>${p[0]}</span><span class="mono small">${p[1].toLocaleString('es-SV')} KB</span><div class="progress"><i style="width:${Math.min(100,p[1]/lim*100)}%;background:var(--accent)"></i></div></div>`).join('')}</div>
   <div class="row"><button class="btn btn-primary" data-act="exportar">${ic('dl',16)}Descargar respaldo</button><label class="btn" for="impFile">${ic('up',16)}Restaurar respaldo</label><input type="file" id="impFile" accept=".json,application/json" hidden>
    <button class="btn btn-ghost" data-act="vaciarBit">Vaciar bitácora</button><button class="btn btn-ghost" data-act="empezarReal" style="color:var(--a)">${DB.demo?'Borrar datos de ejemplo':'Borrar todo y empezar de cero'}</button></div></section>
  <section class="panel"><div class="panel-h"><div class="head-t"><h2>Bitácora completa</h2><span class="small muted">${bit.length} de ${DB.bitacora.length} movimientos</span></div><button class="btn btn-sm" data-act="csvBit">${ic('dl',15)}Exportar</button></div>
   <div class="toolbar"><div class="field" style="flex:1;min-width:200px"><label for="bQ">Buscar acción</label><div class="search">${ic('search',16)}<input id="bQ" type="search" value="${esc(f.q)}" placeholder="Ej.: lista, entrada, rostro…"></div></div>
    <div class="field"><label for="bU">Usuario</label><select id="bU"><option value="">Todos</option>${usuariosBit.map(n=>`<option ${n===f.u?'selected':''}>${esc(n)}</option>`).join('')}</select></div></div>
   ${bit.length?`<div class="tbl-wrap" style="max-height:460px;overflow:auto"><table><thead><tr><th>Fecha y hora</th><th>Usuario</th><th>Acción</th></tr></thead><tbody>${bit.slice(0,300).map(x=>`<tr><td class="mono small" style="white-space:nowrap">${new Date(x.at).toLocaleString('es-SV',{dateStyle:'short',timeStyle:'medium'})}</td><td class="small">${esc(x.u)}</td><td class="small">${esc(x.acc)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty small">Sin movimientos con esos filtros.</div>'}
  </section>`);
  document.querySelectorAll('.adm-role').forEach(sel=>sel.onchange=async()=>{const u=usuario(sel.dataset.id),nuevo=sel.value;
    if(u.rol==='admin'&&nuevo!=='admin'&&adminsActivos().length<=1&&u.activo){toast('Debe quedar al menos un administrador activo.','err');sel.value=u.rol;return}
    if(!await confirmar('¿Cambiar el rol?',`${u.nombre} pasará de ${ROLES[u.rol]} a ${ROLES[nuevo]}.`,'Cambiar rol')){sel.value=u.rol;return}
    log(`Cambió el rol de ${u.usuario}: ${ROLES[u.rol]} → ${ROLES[nuevo]}`);u.rol=nuevo;save();toast('Rol actualizado.');VIEWS.admin()});
  let tq;$('#bQ').oninput=e=>{clearTimeout(tq);tq=setTimeout(()=>{f.q=e.target.value;VIEWS.admin();const q=$('#bQ');q.focus();q.setSelectionRange(q.value.length,q.value.length)},300)};
  $('#bU').onchange=e=>{f.u=e.target.value;VIEWS.admin()};
  $('#fId').onsubmit=ev=>{ev.preventDefault();c.institucion=$('#aI').value.trim()||c.institucion;c.lema=$('#aL').value.trim();log('Actualizó la identidad institucional');save();toast('Identidad guardada.');render()};
  $('#fSeg').onsubmit=ev=>{ev.preventDefault();c.minPass=+$('#aMin').value;c.inactividad=+$('#aIn').value;c.docenteEditaAnteriores=$('#aDoc').checked;log('Actualizó la seguridad del sistema');save();toast('Seguridad guardada.')};
  $('#aLogo').onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{
      const esc2=(m)=>{const k=Math.min(1,m/Math.max(img.width,img.height)),cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return cv.toDataURL('image/png')};
      const full=esc2(520),mini=esc2(160);if(full.length>700000){toast('La imagen es muy pesada. Use un PNG más sencillo o más pequeño.','err');return}
      c.logo=full;c.logoMini=mini;log('Cambió el logo institucional');if(save()){toast('Logo actualizado.');render()}};img.onerror=()=>toast('No se pudo leer la imagen.','err');img.src=rd.result};rd.readAsDataURL(file)};
  bindImport();
};
function dlgPass(u,modo){
  // modo: 'propia' (el usuario cambia la suya), 'forzada' (obligatoria al entrar), 'reset' (admin restablece a otro)
  const reset=modo==='reset',tmp=reset?passTemporal():'';
  dlg.dataset.lock=modo==='forzada'?'1':'';
  openDlg(`<div class="head-t"><span class="eyebrow">${reset?'Restablecer contraseña':modo==='forzada'?'Seguridad de la cuenta':'Mi cuenta'}</span><h2>${reset?esc(u.nombre):modo==='forzada'?'Cree una contraseña nueva':'Cambiar mi contraseña'}</h2>
    ${modo==='forzada'?'<p class="small muted">El administrador restableció su contraseña. Para continuar, elija una contraseña personal que solo usted conozca.</p>':''}</div>
   <form id="fPw" class="form" style="grid-template-columns:1fr">
    ${reset?`<div class="field"><label for="pN">Contraseña temporal</label><input id="pN" value="${tmp}" autocomplete="off"><span class="hint">Compártala con la persona. Puede cambiarla antes de guardar.</span></div>
      <label class="check"><input type="checkbox" id="pF" checked> Pedir que cree su propia contraseña al entrar</label>`
    :`${modo==='propia'?`<div class="field"><label for="pA">Contraseña actual</label><input id="pA" type="password" autocomplete="current-password" required></div>`:''}
      <div class="field"><label for="pN">Contraseña nueva</label><input id="pN" type="password" autocomplete="new-password" required><span class="hint">Mínimo ${MIN_PASS()} caracteres.</span></div>
      <div class="field"><label for="pC">Repita la contraseña nueva</label><input id="pC" type="password" autocomplete="new-password" required></div>`}
    <p class="err" id="pErr"></p>
    <div class="dlg-actions">${modo==='forzada'?'':'<button type="button" class="btn" data-act="cerrar">Cancelar</button>'}<button class="btn btn-primary">${reset?'Restablecer':'Guardar contraseña'}</button></div></form>`);
  $('#fPw').onsubmit=async ev=>{ev.preventDefault();const n=$('#pN').value,er=m=>$('#pErr').textContent=m;
    if(n.length<MIN_PASS())return er(`La contraseña debe tener al menos ${MIN_PASS()} caracteres.`);
    if(!reset){if(n!==$('#pC').value)return er('Las contraseñas no coinciden.');if(modo==='propia'&&await hash($('#pA').value)!==u.hash)return er('La contraseña actual no es correcta.');if(await hash(n)===u.hash)return er('Use una contraseña distinta a la anterior.')}
    u.hash=await hash(n);u.debeCambiar=reset?$('#pF').checked:false;
    log(reset?`Restableció la contraseña de ${u.usuario}`:`Cambió su contraseña`);save();dlg.dataset.lock='';closeDlg();
    if(reset){openDlg(`<div class="head-t"><span class="eyebrow">Contraseña restablecida</span><h2>${esc(u.nombre)}</h2></div><p class="small muted">Entregue estos datos a la persona. ${u.debeCambiar?'Al entrar, el sistema le pedirá crear su propia contraseña.':''}</p>
      <div class="creds" style="display:grid"><span>Usuario</span><b class="mono">${esc(u.usuario)}</b><span>Contraseña</span><b class="mono">${esc(n)}</b></div><div class="dlg-actions"><button class="btn btn-primary" data-act="cerrar">Listo</button></div>`);if(_vista==='admin')VIEWS.admin()}
    else toast('Contraseña actualizada.')};
}
dlg.addEventListener('cancel',e=>{if(dlg.dataset.lock==='1')e.preventDefault()});
function bindImport(){const inp=$('#impFile');if(!inp)return;inp.onchange=e=>{const file=e.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=async()=>{
  let d;try{d=JSON.parse(rd.result)}catch(x){toast('El archivo no es un respaldo válido.','err');return}
  if(!d||!d.config||!Array.isArray(d.usuarios)||!Array.isArray(d.estudiantes)){toast('El archivo no tiene la estructura de un respaldo del Libro de Asistencia.','err');return}
  if(!await confirmar('¿Restaurar este respaldo?',`Reemplazará todos los datos actuales por los del archivo (${d.estudiantes.length} estudiantes, ${Object.keys(d.asistencia||{}).length} días con asistencia).`,'Restaurar',true))return;
  DB=Object.assign(dbVacia(),d);DB.config=Object.assign(configBase(),d.config);asegurarAdmin();save();const yo=DB.usuarios.find(u=>u.id===YO.id&&u.activo);toast('Respaldo restaurado.');if(yo){YO=yo;render()}else salir()};rd.readAsText(file)}}
function asegurarAdmin(){if(!DB.usuarios.length||DB.usuarios.some(u=>u.rol==='admin'))return false;const d=DB.usuarios.find(u=>u.rol==='direccion'&&u.activo)||DB.usuarios.find(u=>u.activo);if(!d)return false;
  d.rol='admin';DB.bitacora.unshift({at:new Date().toISOString(),u:'Sistema',acc:`Asignó el rol de Administrador del sistema a ${d.usuario} (no había superusuario)`});return true}
let _ultimaAct=Date.now();['pointerdown','keydown','touchstart'].forEach(t=>document.addEventListener(t,()=>{_ultimaAct=Date.now()},{passive:true}));
setInterval(()=>{if(!YO||!DB)return;const m=+DB.config.inactividad||0;if(!m||(_vista==='entrada'&&CAM.stream))return;if(Date.now()-_ultimaAct>m*60000){salir();toast('Sesión cerrada por inactividad.')}},20000);

      db.asistencia[f][e.id]={e:v,h:v==='T'?ing:'',o:'',in:via==='lista'?'':ing,via}})});
  db.justificaciones.push({id:uid(),estudianteId:jus.id,desde:dias[dias.length-6],hasta:dias[dias.length-5],tipo:'Médico',documento:true,detalle:'Constancia de consulta por infección respiratoria',estado:'aprobada',por:d1.id,creada:dias[dias.length-4]+'T08:10:00.000Z'});
  db.justificaciones.push({id:uid(),estudianteId:racha.id,desde:dias[dias.length-1],hasta:dias[dias.length-1],tipo:'Familiar',documento:false,detalle:'La madre avisó por teléfono: viaje familiar a La Unión',estado:'pendiente',por:d2.id,creada:h+'T07:55:00.000Z'});
  if(esLectivo(h)){db.asistencia[h]={};db.listas[h]={};
    [0,2].forEach(si=>{const s=db.secciones[si];db.listas[h][s.id]={por:s.docenteId,at:new Date().toISOString()};
      ec(si).forEach(e=>{const r=rnd();let v=r<.9?'P':r<.96?'T':'A';if(e===racha)v='A';const ing=v==='A'?'':v==='T'?`07:${pad(11+Math.floor(rnd()*20))}`:`06:${pad(38+Math.floor(rnd()*21))}`;
        db.asistencia[h][e.id]={e:v,h:v==='T'?ing:'',o:'',in:ing,via:v==='A'?'lista':'qr'}})});
    ec(1).forEach((e,i)=>{if(i%4===3)return;const t=rnd()<.12;const ing=t?`07:${pad(11+Math.floor(rnd()*15))}`:`06:${pad(40+Math.floor(rnd()*19))}`;db.asistencia[h][e.id]={e:t?'T':'P',h:t?ing:'',o:'',in:ing,via:i%5===0?'manual':'qr'}})}
  db.bitacora=[{at:new Date().toISOString(),u:'Sistema',acc:'Cargó los datos de ejemplo'}];
  return db;
}
